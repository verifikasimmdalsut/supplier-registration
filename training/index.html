<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Training Gudang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAFAF8;
    --surface:#FFFFFF;
    --surface-2:#F1F1EC;
    --border:#E3E2DA;
    --ink:#122146;
    --text:#232A3B;
    --text-muted:#6E7488;
    --accent:#F2971D;
    --accent-soft:#FFF1DC;
    --good:#0F7B63;
    --good-soft:#E3F3EE;
    --bad:#C8432F;
    --radius:14px;
    --font-display:"Space Grotesk", -apple-system, sans-serif;
    --font-body:"Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --c-counter:#0F7B63;
    --c-counter-soft:#E3F3EE;
    --c-scanner:#F2971D;
    --c-scanner-soft:#FFF1DC;
    --c-auditor:#122146;
    --c-auditor-soft:#E7EAF2;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:var(--font-body);
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  #app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    padding:24px 20px 40px;
    display:flex;
    flex-direction:column;
  }
  .brand{
    font-size:12px;
    letter-spacing:0.03em;
    color:var(--text-muted);
    margin-bottom:10px;
  }
  .barcode{
    display:flex;
    align-items:flex-end;
    gap:2px;
    height:28px;
    margin-bottom:14px;
  }
  .barcode span{ display:block; width:3px; background:var(--ink); border-radius:1px; }
  h1{ font-family:var(--font-display); color:var(--ink); font-size:25px; font-weight:600; margin:0 0 22px; line-height:1.3; }
  h2{ font-family:var(--font-display); color:var(--ink); font-size:19px; font-weight:600; margin:0 0 6px; }
  p.sub{ color:var(--text-muted); font-size:14px; margin:0 0 20px; line-height:1.5; }

  .section-grid{ display:flex; flex-direction:column; gap:12px; }
  .section-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-left:4px solid var(--c);
    border-radius:10px;
    padding:18px 20px;
    text-align:left;
    color:var(--text);
    cursor:pointer;
    font-family:inherit;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .section-card:active{ transform:scale(0.98); }
  .section-card .label{ font-family:var(--font-display); font-size:17px; font-weight:600; color:var(--ink); }
  .section-card .desc{ font-size:13px; color:var(--text-muted); margin-top:2px; }
  .chev{ color:var(--text-muted); font-size:20px; }

  input[type=text]{
    width:100%;
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--text);
    padding:14px 16px;
    border-radius:10px;
    font-size:16px;
    margin-bottom:12px;
  }
  input[type=text]:focus{ outline:none; border-color:var(--accent); }

  select{
    width:100%;
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--text);
    padding:14px 16px;
    border-radius:10px;
    font-size:16px;
    margin-bottom:12px;
  }

  button.primary{
    width:100%;
    background:var(--accent);
    color:#2B1900;
    border:none;
    padding:15px 16px;
    border-radius:10px;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    margin-top:4px;
  }
  button.primary:active{ transform:scale(0.98); }
  button.primary:disabled{ opacity:0.45; cursor:default; }
  button.ghost{
    width:100%;
    background:transparent;
    color:var(--text-muted);
    border:1px solid var(--border);
    padding:13px 16px;
    border-radius:10px;
    font-size:14px;
    cursor:pointer;
    margin-top:10px;
  }
  button.link{
    background:none;
    border:none;
    color:var(--text-muted);
    font-size:13px;
    text-decoration:underline;
    cursor:pointer;
    padding:0;
    margin-top:auto;
    align-self:center;
  }

  .error{ color:var(--bad); font-size:13px; margin:-6px 0 12px; }
  .success-text{ color:var(--good); font-size:13px; margin:-6px 0 12px; }

  .top-nav{ display:flex; align-items:center; gap:10px; margin-bottom:20px; }
  .back{ background:none; border:none; color:var(--text-muted); font-size:22px; cursor:pointer; padding:0; line-height:1; }

  .tag{
    display:inline-block;
    font-family:var(--font-display);
    font-size:12px;
    font-weight:600;
    padding:5px 12px;
    border-radius:20px;
    margin-bottom:14px;
  }

  .materi-box{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:20px;
    font-size:15px;
    line-height:1.7;
        margin-bottom:20px;
    flex:1;
  }


  .pdf-btn{
    display:block; text-align:center; text-decoration:none;
    background:var(--ink); color:#fff; font-weight:600; font-size:15px;
    padding:14px 16px; border-radius:10px; margin:6px 0 16px;
  }
  .materi-h{ font-family:var(--font-display); font-size:16px; font-weight:600; color:var(--ink); margin:22px 0 8px; }

  .materi-p{ margin:0 0 8px; line-height:1.65; }
  .materi-ul{ margin:0 0 8px; padding-left:20px; }
  .materi-ul li{ margin-bottom:6px; line-height:1.6; }
  .menu-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-left:4px solid var(--c, var(--border));
    border-radius:10px;
    padding:16px 18px;
    margin-bottom:12px;
    display:flex;
    align-items:center;
    justify-content:space-between;

  .menu-left{ display:flex; flex-direction:column; }
  .menu-title{ font-family:var(--font-display); font-size:16px; font-weight:600; color:var(--ink); }
  .menu-desc{ font-size:12px; color:var(--text-muted); margin-top:3px; }
  .menu-btn{

    color:#2B1900;
    border:none;
    padding:9px 16px;
    border-radius:8px;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    white-space:nowrap;
    font-family:var(--font-body);

  .badge-score{

    font-size:13px;
    font-weight:600;
    color:var(--good);
    background:var(--good-soft);
    padding:5px 12px;
    border-radius:20px;
  }

  .soal-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:18px;
    margin-bottom:14px;
  }
  .soal-num{ font-size:13px; color:var(--text-muted); margin-bottom:6px; }
  .soal-teks{ font-size:16px; font-weight:600; margin-bottom:14px; line-height:1.4; }
  .pilihan{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:12px 14px;
    border:1px solid var(--border);
    border-radius:10px;
    margin-bottom:8px;
    cursor:pointer;
    background:var(--surface);
  }
  .pilihan.selected{ border-color:var(--accent); background:var(--accent-soft); }
  .pilihan .huruf{
    width:22px; height:22px; border-radius:50%;
    border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:700; color:var(--text-muted);
    flex-shrink:0; background:var(--surface);
  }
  .pilihan.selected .huruf{ background:var(--accent); border-color:var(--accent); color:#2B1900; }
  .pilihan .teks{ font-size:14px; line-height:1.5; }

  .center-flex{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
  .score-circle{
    width:164px; height:164px; border-radius:50%;
    border:2px dashed var(--accent);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    margin-bottom:20px; background:var(--accent-soft);
    position:relative;
  }
  .score-circle::before{
    content:"";
    position:absolute; inset:10px;
    border-radius:50%;
    background:var(--surface);
    border:1px solid var(--border);
  }
  .score-num{ font-family:var(--font-display); font-size:42px; font-weight:600; color:var(--ink); position:relative; }
  .score-label{ font-size:11px; letter-spacing:0.04em; color:var(--text-muted); margin-top:2px; position:relative; }

  .loading{ text-align:center; color:var(--text-muted); padding:40px 0; font-size:14px; }

  .progress-bar{ height:4px; background:var(--surface-2); border-radius:2px; margin-bottom:20px; overflow:hidden; }
  .progress-fill{ height:100%; background:var(--accent); transition:width .2s ease; }


  .barcode.small{ height:18px; margin-bottom:10px; }
  .tabs{ display:flex; gap:6px; margin:14px 0 18px; border-bottom:1px solid var(--border); }
  .tab{
    background:none; border:none; padding:10px 12px; font-family:var(--font-display);
    font-size:14px; font-weight:600; color:var(--text-muted); cursor:pointer;
    border-bottom:3px solid transparent; margin-bottom:-1px;
  }
  .tab.active{ color:var(--ink); border-bottom-color:var(--accent); }
  .stat-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:16px; }
  .stat-grid.two{ grid-template-columns:repeat(2,1fr); }
  .stat{ background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px 12px; }
  .stat-num{ font-family:var(--font-display); font-size:28px; font-weight:600; line-height:1; }
  .stat-label{ font-size:12px; color:var(--text-muted); margin-top:6px; }
  .filters{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:12px; }
  .filters.one{ grid-template-columns:1fr; }
  .filters select{ margin-bottom:0; padding:11px 10px; font-size:14px; }
  .result-list{ margin-top:16px; }
  .result-item{
    background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--c, var(--border));
    border-radius:10px; padding:12px 14px; margin-bottom:8px;

  }
  .result-name{ font-family:var(--font-display); font-size:15px; font-weight:600; color:var(--ink); }
  .result-meta{ font-size:12px; color:var(--text-muted); margin-top:3px; }
  .result-right{ display:flex; align-items:center; gap:8px; flex-shrink:0; }
  .nilai-badge{ font-family:var(--font-display); font-weight:600; font-size:15px; min-width:44px; text-align:center; padding:6px 10px; border-radius:8px; }
  .nilai-badge.pass{ background:var(--good-soft); color:var(--good); }
  .nilai-badge.fail{ background:#FBE7E3; color:var(--bad); }
  .mini-btn{ background:var(--surface); border:1px solid var(--border); color:var(--ink); font-size:12px; font-weight:600; padding:7px 10px; border-radius:8px; cursor:pointer; font-family:var(--font-body); }
  .menu-btn.wait{ background:var(--surface-2); color:var(--text-muted); }
  a.menu-btn{ text-decoration:none; display:inline-block; }
  .so-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:12px; }
  .so-card h3{ margin:0 0 6px; font-family:var(--font-display); color:var(--ink); font-size:17px; }
  .chip{ display:inline-block; padding:3px 10px; border-radius:99px; font-size:12px; font-weight:600; background:var(--accent-soft); color:#8A5200; margin-right:6px; }
  .chip.good{ background:var(--good-soft); color:var(--good); }
  .chip.muted{ background:var(--surface-2); color:var(--text-muted); }
  .gond{ border-top:1px dashed var(--border); padding:8px 0; font-size:13px; }
  .gond b{ font-family:var(--font-display); color:var(--ink); font-size:15px; }
  .so-card input[type=text]{ margin-bottom:8px; }
  .menu-btn.ask{ background:var(--ink); color:#fff; }
  .badge-wait{ font-family:var(--font-display); font-size:12px; font-weight:600; color:#8a5a00; background:var(--accent-soft); padding:5px 12px; border-radius:20px; white-space:nowrap; }
  .gel-chip{ display:inline-block; font-size:12px; font-weight:600; color:var(--text-muted); background:var(--surface-2); padding:3px 10px; border-radius:20px; margin-left:6px; vertical-align:middle; }
  .ap-actions{ display:flex; gap:6px; }
  .mini-btn.ok{ background:var(--good-soft); color:var(--good); border-color:transparent; }
  .mini-btn.no{ background:#FBE7E3; color:var(--bad); border-color:transparent; }
  .row-gap{ display:flex; gap:8px; align-items:center; margin-bottom:12px; }
  .row-gap select{ margin-bottom:0; }
  .row-gap button{ width:auto; margin:0; white-space:nowrap; padding:12px 16px; }
  .admin-field label{ font-size:13px; font-weight:600; color:var(--text-muted); display:block; margin-bottom:6px; }
</style>

<script>

async function sb(path){
  const res = await fetch(SUPABASE_URL + "/rest/v1/" + path, {
    headers:{ "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY }
  });
  if(!res.ok) throw new Error("Gagal ambil data");
  return res.json();
}
async function sbInsert(table, body){
  const res = await fetch(SUPABASE_URL + "/rest/v1/" + table, {
    method:"POST",
    headers:{ "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY, "Content-Type":"application/json", "Prefer":"return=minimal" },
    body: JSON.stringify(body)
  });
  if(!res.ok) throw new Error("Gagal simpan data");
}
async function sbUpsert(table, body, conflictCols){
  const res = await fetch(SUPABASE_URL + "/rest/v1/" + table + "?on_conflict=" + conflictCols, {
    method:"POST",
    headers:{ "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY, "Content-Type":"application/json", "Prefer":"resolution=merge-duplicates,return=minimal" },
    body: JSON.stringify(body)
  });
  if(!res.ok) throw new Error("Gagal update data");
}

async function sbPatch(path, body){

    headers:{ "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY, "Content-Type":"application/json", "Prefer":"return=minimal" },
    body: JSON.stringify(body)
  });
  if(!res.ok) throw new Error("Gagal update data");
}

const SECTION_INFO = {
  counter: { label:"Counter", desc:"Login pakai nama, NIK, brand, dan departemen", color:"var(--c-counter)", soft:"var(--c-counter-soft)" },
  scanner: { label:"Scanner", desc:"Login pakai NIK terdaftar", color:"var(--c-scanner)", soft:"var(--c-scanner-soft)" },
  auditor: { label:"Auditor", desc:"Login pakai NIK terdaftar", color:"var(--c-auditor)", soft:"var(--c-auditor-soft)" }
};
const JENIS_INFO = {
  pretest: { label:"Pre Test", desc:"Dikerjakan sebelum materi selesai dievaluasi" },
  posttest: { label:"Post Test", desc:"Dikerjakan setelah materi selesai dipelajari" }
};

let state = {

  inputBrand: "",

function setState(patch){ state = Object.assign({}, state, patch); render(); }

function render(){
  const app = document.getElementById("app");
  app.innerHTML = "";
  app.style.maxWidth = (state.screen === "admin" && state.adminAuthed) ? "760px" : "480px";
  if(state.screen === "home") app.appendChild(renderHome());
  else if(state.screen === "login") app.appendChild(renderLogin());
  else if(state.screen === "menu") app.appendChild(renderMenu());
  else if(state.screen === "so") app.appendChild(renderSO());
  else if(state.screen === "dashboard") app.appendChild(renderDashboard());
  else if(state.screen === "materi") app.appendChild(renderMateri());
  else if(state.screen === "kuis") app.appendChild(renderKuis());
  else if(state.screen === "hasil") app.appendChild(renderHasil());
  else if(state.screen === "admin") app.appendChild(renderAdmin());
}

function el(tag, props, children){
  const e = document.createElement(tag);
  if(props) for(const k in props){
    if(k === "class") e.className = props[k];
    else if(k === "text") e.textContent = props[k];
    else if(k.startsWith("on")) e.addEventListener(k.slice(2).toLowerCase(), props[k]);
    else if(props[k] === null || props[k] === undefined || props[k] === false) e.removeAttribute(k);
    else e.setAttribute(k, props[k]);
  }
  if(children) children.forEach(c => c && e.appendChild(c));
  return e;
}

function isCounter(){ return state.section === "counter"; }

function tagEl(text, info){
  return el("div", {class:"tag", text:text, style:"background:" + info.soft + ";color:" + info.color + ";"});
}

function barcodeEl(){
  const bar = el("div", {class:"barcode"});
  const widths = [2,1,3,1,2,4,1,2,1,3,2,1,4,1,2,3,1,2];
  widths.forEach((w,i)=>{
    const h = 14 + ((i*7) % 14);
    bar.appendChild(el("span", {style:"width:" + w + "px;height:" + h + "px;"}));
  });
  return bar;
}

function renderHome(){
  const wrap = el("div");

  wrap.appendChild(el("div", {class:"brand", text:"Training gudang"}));
  wrap.appendChild(el("h1", {text:"Pilih bagian yang kamu ikuti"}));
  const grid = el("div", {class:"section-grid"});
  ["counter","scanner","auditor"].forEach(key=>{
    const info = SECTION_INFO[key];
    const card = el("button", { class:"section-card", style:"--c:" + info.color, onClick: ()=> setState({screen:"login", section:key, inputVal:"", inputNik:"", inputBrand:"", inputDept:"", errorMsg:""}) });
    const left = el("div");
    left.appendChild(el("div", {class:"label", text:info.label}));
    left.appendChild(el("div", {class:"desc", text:info.desc}));
    card.appendChild(left);
    card.appendChild(el("span", {class:"chev", text:"\u203a"}));
    grid.appendChild(card);
  });
  wrap.appendChild(grid);
  wrap.appendChild(el("button", {class:"link", text:"Masuk sebagai admin", onClick: ()=> setState({screen:"admin", adminMsg:""})}));
  return wrap;
}

function renderLogin(){

  wrap.appendChild(tagEl(info.label, info));

  const counterMode = isCounter();

  const input = el("input", { type:"text", placeholder: counterMode ? "Nama lengkap" : "Contoh: 3201xxxxxxxx", value: state.inputVal });
  input.addEventListener("input", e => { state.inputVal = e.target.value; });
  wrap.appendChild(input);

  let brandInput = null, deptInput = null, nikInput = null;
  if(counterMode){
    nikInput = el("input", { type:"text", placeholder:"NIK", value: state.inputNik });
    nikInput.addEventListener("input", e => { state.inputNik = e.target.value; });
    wrap.appendChild(nikInput);
    brandInput = el("input", { type:"text", placeholder:"Brand", value: state.inputBrand });
    brandInput.addEventListener("input", e => { state.inputBrand = e.target.value; });
    wrap.appendChild(brandInput);
    deptInput = el("input", { type:"text", placeholder:"Departemen", value: state.inputDept });
    deptInput.addEventListener("input", e => { state.inputDept = e.target.value; });
    wrap.appendChild(deptInput);
  }

  if(state.errorMsg) wrap.appendChild(el("div", {class:"error", text: state.errorMsg}));

    const val = input.value.trim();
    if(!val){ setState({errorMsg: counterMode ? "Nama belum diisi." : "NIK belum diisi."}); return; }

      const nk = nikInput.value.trim().replace(/\s+/g, "");
      const br = brandInput.value.trim(), dp = deptInput.value.trim();
      if(!nk){ setState({errorMsg:"NIK belum diisi."}); return; }
      if(!br){ setState({errorMsg:"Brand belum diisi."}); return; }
      if(!dp){ setState({errorMsg:"Departemen belum diisi."}); return; }
      setState({nama: val, nik: nk, identifier: val, brand: br, departemen: dp, errorMsg:"", screen:"menu"});
      fetchLayoutUrl();
      return;
    }
    setState({loading:true, errorMsg:""});
    try{
      const rows = await sb("training_peserta_nik?nik=eq." + encodeURIComponent(val) + "&section=eq." + state.section + "&select=nama,nik");
      if(rows.length === 0){
        setState({loading:false, errorMsg:"NIK tidak terdaftar untuk bagian " + info.label + "."});
        return;
      }
      setState({loading:false, nama: rows[0].nama, nik: rows[0].nik, identifier: rows[0].nik, screen:"menu"});
      fetchLayoutUrl();
    }catch(err){
      setState({loading:false, errorMsg:"Gagal memeriksa NIK. Coba lagi."});
    }
  });
  wrap.appendChild(btn);
  setTimeout(()=> input.focus(), 50);
  return wrap;
}

async function loadDashboard(){

    const progRows = await sb("training_progress?section=eq." + state.section + "&identifier=eq." + encodeURIComponent(state.identifier) + "&select=sudah_baca_materi");
    const lockRows = await sb("training_test_lock?section=eq." + state.section + "&identifier=eq." + encodeURIComponent(state.identifier) + "&select=jenis,selesai,boleh_ulang");
    const hasilRows = await sb("training_hasil?section=eq." + state.section + "&identifier=eq." + encodeURIComponent(state.identifier) + "&gelombang=eq." + gelombang + "&select=jenis,nilai,selesai_at&order=selesai_at.desc");

    const locks = { pretest:{selesai:false, boleh_ulang:false, nilai:null}, posttest:{selesai:false, boleh_ulang:false, nilai:null} };
    lockRows.forEach(r=>{ locks[r.jenis].selesai = r.selesai; locks[r.jenis].boleh_ulang = r.boleh_ulang; });
    ["pretest","posttest"].forEach(j=>{

async function requestTest(jenis){
  setState({loading:true});
  const body = {
    section: state.section, identifier: state.identifier, nama: state.nama,
    brand: state.brand || null, departemen: state.departemen || null,
    jenis: jenis, gelombang: state.gelombang, status: "menunggu"
  };
  try{

async function startTest(jenis){
  const lock = state.locks[jenis];
  const retake = lock.selesai && lock.boleh_ulang;
  if(!retake){
    setState({loading:true});
    let st = null;
    try{ st = (await fetchApprovals())[jenis]; }catch(e){}
    if(st !== "disetujui"){ await loadDashboard(); return; }
    setState({loading:false});
  }
  setState({currentJenis: jenis});
  loadKuis();
}

function renderDashboard(){
  const info = SECTION_INFO[state.section];
  const wrap = el("div");

  nav.appendChild(el("button", {class:"back", text:"\u2190", onClick:()=> setState({screen:"menu"})}));

  wrap.appendChild(el("p", {class:"sub", text:"Materi bisa dibaca kapan saja. Pre Test dan Post Test perlu persetujuan admin dulu. Post Test baru bisa diajukan setelah Pre Test selesai."}));

  // Materi card
  const materiCard = el("div", {class:"menu-card", style:"--c:" + info.color});
  const materiLeft = el("div", {class:"menu-left"});
  materiLeft.appendChild(el("div", {class:"menu-title", text:"Materi"}));

  materiBtn.addEventListener("click", ()=>{ setState({screen:"materi"}); loadMateri(); });
  materiCard.appendChild(materiBtn);
  wrap.appendChild(materiCard);

  // Pretest & Posttest cards (butuh persetujuan admin)
  const pretestDone = state.approvals.pretest === "dipakai" && !state.locks.pretest.boleh_ulang;
  wrap.appendChild(el("div", {class:"sub", style:"margin:-8px 0 14px;", text:"Gelombang " + state.gelombang}));
  ["pretest","posttest"].forEach(jenis=>{
    const jinfo = JENIS_INFO[jenis];
    const lock = state.locks[jenis];
    const ap = state.approvals[jenis];
    const retake = lock.selesai && lock.boleh_ulang;
    const done = ap === "dipakai" && !retake;
    const gatedByPretest = jenis === "posttest" && !pretestDone && !done && !retake;
    const card = el("div", {class:"menu-card" + (gatedByPretest ? " disabled" : ""), style:"--c:" + info.color});
    const left = el("div", {class:"menu-left"});
    left.appendChild(el("div", {class:"menu-title", text: jinfo.label}));
    let desc = "Perlu persetujuan admin sebelum mulai";
    if(retake) desc = "Sudah dibuka admin untuk mengulang";
    else if(done) desc = "Sudah dikerjakan, hubungi admin untuk mengulang";
    else if(gatedByPretest) desc = "Selesaikan Pre Test dulu";
    else if(ap === "disetujui") desc = "Disetujui admin, silakan mulai";
    else if(ap === "menunggu") desc = "Menunggu persetujuan admin (halaman ini memeriksa otomatis)";
    else if(ap === "ditolak") desc = "Permintaan ditolak admin. Hubungi admin atau ajukan lagi";
    left.appendChild(el("div", {class:"menu-desc", text: desc}));
    card.appendChild(left);

    if(done){
      card.appendChild(el("div", {class:"badge-score", text:"Nilai " + (lock.nilai != null ? lock.nilai : "-")}));
    } else if(retake){
      const btn = el("button", {class:"menu-btn", text:"Ulang"});
      btn.addEventListener("click", ()=> startTest(jenis));
      card.appendChild(btn);
    } else if(gatedByPretest){
      card.appendChild(el("button", {class:"menu-btn", text:"Ajukan", disabled:true}));
    } else if(ap === "disetujui"){
      const btn = el("button", {class:"menu-btn", text:"Mulai"});
      btn.addEventListener("click", ()=> startTest(jenis));
      card.appendChild(btn);
    } else if(ap === "menunggu"){
      card.appendChild(el("div", {class:"badge-wait", text:"Menunggu admin"}));
    } else {
      const btn = el("button", {class:"menu-btn ask", text: ap === "ditolak" ? "Ajukan lagi" : "Ajukan"});
      btn.addEventListener("click", ()=> requestTest(jenis));
      card.appendChild(btn);
    }
    wrap.appendChild(card);
  });

  return wrap;
}

function renderKonten(konten){
  const box = el("div", {class:"materi-box"});
  let ul = null;
  String(konten || "").split("\n").forEach(raw=>{
    const line = raw.trim();
    if(!line){ ul = null; return; }
    if(line.startsWith("## ")){
      ul = null;
      box.appendChild(el("h3", {class:"materi-h", text: line.slice(3)}));
    } else if(line.startsWith("- ")){
      if(!ul){ ul = el("ul", {class:"materi-ul"}); box.appendChild(ul); }
      ul.appendChild(el("li", {text: line.slice(2)}));
    } else {
      ul = null;
      box.appendChild(el("p", {class:"materi-p", text: line}));
    }
  });
  return box;
}

function renderKuis(){
  const info = SECTION_INFO[state.section];
  const jinfo = JENIS_INFO[state.currentJenis];
  const wrap = el("div");
  wrap.appendChild(tagEl(info.label + " \u00b7 " + jinfo.label, info));

  if(state.loading){
    wrap.appendChild(el("div", {class:"loading", text:"Memuat soal..."}));
    return wrap;
  }
  if(state.soalList.length === 0){
    wrap.appendChild(el("h2", {text:"Soal belum tersedia"}));
    wrap.appendChild(el("p", {class:"sub", text:"Admin belum menambahkan soal untuk bagian ini."}));
    wrap.appendChild(el("button", {class:"ghost", text:"Kembali ke menu", onClick:()=> setState({screen:"dashboard"})}));
    return wrap;
  }

  const answered = Object.keys(state.jawaban).length;
  const total = state.soalList.length;
  wrap.appendChild(el("h2", {text: jinfo.label + " " + info.label}));
  wrap.appendChild(el("p", {class:"sub", text: answered + " dari " + total + " soal terjawab \u00b7 hanya bisa dikerjakan sekali"}));
  const bar = el("div", {class:"progress-bar"});
  bar.appendChild(el("div", {class:"progress-fill", style:"width:" + Math.round(answered/total*100) + "%"}));
  wrap.appendChild(bar);

  state.soalList.forEach((soal, idx)=>{
    const card = el("div", {class:"soal-card"});
    card.appendChild(el("div", {class:"soal-num", text:"Soal " + (idx+1) + " dari " + total}));
    card.appendChild(el("div", {class:"soal-teks", text: soal.pertanyaan}));
    ["a","b","c","d"].forEach(letter=>{
      const teks = soal["pilihan_" + letter];
      if(!teks) return;
      const isSel = state.jawaban[soal.id] === letter.toUpperCase();
      const opt = el("div", {class:"pilihan" + (isSel ? " selected" : "")});
      opt.appendChild(el("div", {class:"huruf", text: letter.toUpperCase()}));
      opt.appendChild(el("div", {class:"teks", text: teks}));
      opt.addEventListener("click", ()=>{ state.jawaban[soal.id] = letter.toUpperCase(); render(); });
      card.appendChild(opt);
    });
    wrap.appendChild(card);
  });

  if(state.errorMsg) wrap.appendChild(el("div", {class:"error", text: state.errorMsg}));

  const btn = el("button", {class:"primary", text: state.loading ? "Menyimpan..." : "Selesai, kirim jawaban"});
  btn.addEventListener("click", submitKuis);
  wrap.appendChild(btn);
  return wrap;
}

async function submitKuis(){
  const total = state.soalList.length;
  const answered = Object.keys(state.jawaban).length;
  if(answered < total){
    setState({errorMsg:"Masih ada " + (total - answered) + " soal yang belum dijawab."});
    return;
  }
  let benar = 0;
  state.soalList.forEach(soal=>{ if(state.jawaban[soal.id] === soal.jawaban_benar) benar++; });
  const nilai = Math.round((benar/total)*100);
  setState({loading:true, errorMsg:""});
  try{
    await sbInsert("training_hasil", {
      section: state.section, nama: state.nama, nik: state.nik || null, identifier: state.identifier,
      jenis: state.currentJenis, benar: benar, total: total, nilai: nilai,
      brand: state.brand || null, departemen: state.departemen || null,
      gelombang: state.gelombang
    });
    await sbUpsert("training_test_lock", {
      section: state.section, identifier: state.identifier, jenis: state.currentJenis,
      selesai: true, boleh_ulang: false
    }, "section,identifier,jenis");
  }catch(err){ /* tetap tampilkan nilai walau gagal simpan */ }
  try{
    await sbPatch("training_approval?section=eq." + state.section + "&identifier=eq." + encodeURIComponent(state.identifier) + "&jenis=eq." + state.currentJenis + "&gelombang=eq." + state.gelombang, { status:"dipakai" });
  }catch(err){ /* abaikan */ }
  const locks = Object.assign({}, state.locks);
  const approvals = Object.assign({}, state.approvals);
  approvals[state.currentJenis] = "dipakai";
  locks[state.currentJenis] = { selesai:true, boleh_ulang:false, nilai:nilai };
  setState({loading:false, screen:"hasil", hasil:{benar, total, nilai}, locks, approvals});
}

function fmtTanggal(iso){
  const d = new Date(iso);
  return d.toLocaleDateString("id-ID", {day:"2-digit", month:"short"}) + " " +
         d.toLocaleTimeString("id-ID", {hour:"2-digit", minute:"2-digit"});
}

function copyText(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    return navigator.clipboard.writeText(text);
  }
  const ta = document.createElement("textarea");
  ta.value = text; document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); }catch(e){}
  document.body.removeChild(ta);
  return Promise.resolve();
}

function selectEl(options, current, onChange){
  const s = el("select");
  options.forEach(o=>{
    const opt = el("option", {value:o[0], text:o[1]});
    if(current === o[0]) opt.setAttribute("selected","true");
    s.appendChild(opt);
  });
  s.addEventListener("change", e=> onChange(e.target.value));
  return s;
}

    });

    setState({adminMsg:"Daftar remedial tersalin, tinggal paste ke WhatsApp."});
  });

  const list = el("div", {class:"result-list"});

    list.appendChild(el("div", {class:"loading", text:"Belum ada data untuk filter ini."}));

    left.appendChild(el("div", {class:"result-name", text:r.nama}));
    left.appendChild(el("div", {class:"result-meta", text: (r.section === "counter" && (r.brand || r.departemen) ? (r.brand || "-") + " / " + (r.departemen || "-") : r.identifier) + " \u00b7 " + info.label + " \u00b7 " + JENIS_INFO[r.jenis].label + " \u00b7 G" + r.gelombang + " \u00b7 " + fmtTanggal(r.selesai_at)}));
    item.appendChild(left);
    const right = el("div", {class:"result-right"});

    right.appendChild(el("div", {class:"nilai-badge " + (pass ? "pass" : "fail"), text:String(r.nilai)}));
    if(!pass){

      ub.addEventListener("click", async ()=>{
        try{
          await sbUpsert("training_test_lock", {section:r.section, identifier:r.identifier, jenis:r.jenis, selesai:true, boleh_ulang:true}, "section,identifier,jenis");

const AP_STATUS_LABEL = { menunggu:"Menunggu", disetujui:"Disetujui", ditolak:"Ditolak", dipakai:"Selesai" };

async function decideApproval(ids, status){
  const stamp = new Date().toISOString();
  setState({adminLoading:true, adminMsg:""});
  try{
    for(const id of ids){
      await sbPatch("training_approval?id=eq." + id, { status:status, decided_at: stamp });
    }
    const approvals = await sb("training_approval?select=id,section,identifier,nama,brand,departemen,jenis,gelombang,status,requested_at&order=requested_at.asc&limit=5000");
    setState({adminLoading:false, adminData:Object.assign({}, state.adminData, {approvals}),
      adminMsg:"Berhasil: " + ids.length + " permintaan " + (status === "disetujui" ? "disetujui." : "ditolak.")});
  }catch(err){
    setState({adminLoading:false, adminMsg:"Gagal memperbarui. Coba lagi."});
  }
}

async function loadSO(){
  setState({screen:"so", soLoading:true, soMsg:"", soData:null});
  try{
    const role = state.section, nik = encodeURIComponent(state.nik);
    const col = role === "scanner" ? "scanner_nik" : role === "auditor" ? "auditor_nik" : "counter_nik";
    const kegiatan = await sb("so_kegiatan?registrasi_buka=eq.true&select=*&order=tanggal.asc");
    const items = [];
    for(const k of kegiatan){
      const pen = await sb("so_penugasan?kegiatan_id=eq." + k.id + "&" + col + "=eq." + nik + "&select=gondola,scanner_nama,scanner_lokasi,auditor_nama,auditor_lokasi,counter_nama,counter_brand&order=gondola.asc");
      const reg = await sb("so_registrasi?kegiatan_id=eq." + k.id + "&nik=eq." + nik + "&role=eq." + role + "&select=*");
      items.push({k, pen, reg});
    }
    setState({soLoading:false, soData:items});
  }catch(e){
    setState({soLoading:false, soData:[], soMsg:"Gagal memuat data registrasi. Coba lagi."});
  }
}

function groupGondola(rows, role){
  const out = []; let cur = null;
  rows.forEach(r=>{
    const lok = role === "auditor" ? r.auditor_lokasi : r.scanner_lokasi;
    const key = [r.scanner_nama, r.auditor_nama, r.counter_nama, lok].join("|");
    if(cur && cur.key === key && r.gondola === cur.to + 1){ cur.to = r.gondola; }
    else { cur = {key, from:r.gondola, to:r.gondola, lok, scanner:r.scanner_nama, auditor:r.auditor_nama, counter:r.counter_nama}; out.push(cur); }
  });
  return out;
}

function fmtTgl(iso){
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString("id-ID", {weekday:"long", day:"numeric", month:"long", year:"numeric"});
}

async function submitSO(k, vals){
  const role = state.section;
  const body = { kegiatan_id:k.id, nik:state.nik, role, sesi:k.sesi_aktif, nama:state.nama,
    departemen: role === "counter" ? state.departemen : null,
    hht_no: vals.hht || null, papan_jalan_no: vals.papan || null, id_participant: vals.idp || null,
    registered_at: new Date().toISOString() };
  try{
    await sbUpsert("so_registrasi", body, "kegiatan_id,nik,role,sesi");
    await loadSO();
    setState({soMsg:"Registrasi tersimpan."});
  }catch(e){
    setState({soMsg:"Gagal menyimpan registrasi. Coba lagi."});
  }
}

  nav.appendChild(el("button", {class:"back", text:"←", onClick:()=> setState({screen:"menu", soMsg:""})}));
  wrap.appendChild(nav);
  wrap.appendChild(tagEl(info.label + " · " + state.nama, info));
  wrap.appendChild(el("h2", {text:"Registrasi SO"}));
  if(state.soLoading || !state.soData){
    wrap.appendChild(el("div", {class:"loading", text:"Memuat..."}));
    return wrap;
  }
  if(state.soMsg) wrap.appendChild(el("div", {class: state.soMsg.indexOf("Gagal") === 0 ? "error" : "success-text", style:"margin-bottom:10px;", text:state.soMsg}));
  if(state.soData.length === 0){
    wrap.appendChild(el("p", {class:"sub", text:"Registrasi SO belum dibuka oleh admin. Coba lagi nanti."}));
    return wrap;
  }
  state.soData.forEach(({k, pen, reg})=>{
    const card = el("div", {class:"so-card"});
    card.appendChild(el("h3", {text:k.nama}));
    const meta = el("div", {style:"margin-bottom:8px;"});
    meta.appendChild(el("span", {class:"chip muted", text:fmtTgl(k.tanggal)}));
    meta.appendChild(el("span", {class:"chip", text: k.sesi_aktif ? "Sesi " + SESI_LABEL[k.sesi_aktif] : "Sesi belum ditentukan"}));
    card.appendChild(meta);

    const ranges = groupGondola(pen, role);
    if(ranges.length){
      card.appendChild(el("div", {class:"sub", style:"margin:4px 0;", text:"Gondola tugas kamu"}));
      ranges.forEach(g=>{
        const box = el("div", {class:"gond"});
        const b = el("b", {text: g.from === g.to ? String(g.from) : g.from + " – " + g.to});
        box.appendChild(b);
        if(g.lok) box.appendChild(el("span", {class:"chip muted", style:"margin-left:8px;", text:g.lok}));
        const team = [];
        if(g.counter) team.push("Counter: " + g.counter);
        if(g.scanner) team.push("Scanner: " + g.scanner);
        if(g.auditor) team.push("Auditor: " + g.auditor);
        if(team.length) box.appendChild(el("div", {class:"menu-desc", text:team.join(" · ")}));
        card.appendChild(box);
      });
    } else if(role === "counter"){
      card.appendChild(el("p", {class:"sub", text:"Penugasan gondola untuk Counter belum tersedia."}));
    } else {
      card.appendChild(el("p", {class:"sub", text:"Tidak ada penugasan gondola atas NIK kamu di kegiatan ini. Hubungi admin jika seharusnya ada."}));
    }

    const canReg = !!k.sesi_aktif && (role === "counter" || ranges.length > 0);
    const mine = reg.find(r=> r.sesi === k.sesi_aktif);
    if(!k.sesi_aktif){
      card.appendChild(el("p", {class:"sub", text:"Admin belum menentukan sesi (Backroom atau Selling). Registrasi dibuka setelah sesi ditentukan."}));
    } else if(canReg){
      if(mine && mine.dikembalikan){
        card.appendChild(el("span", {class:"chip good", text:"Sarana sudah dikembalikan"}));
      } else {
        if(mine) card.appendChild(el("div", {style:"margin:8px 0;"}, [el("span", {class:"chip good", text:"Sudah registrasi · sesi " + SESI_LABEL[k.sesi_aktif]})]));
        let hht=null, papan=null, idp=null;
        if(role === "scanner"){
          hht = el("input", {type:"text", placeholder:"Nomor HHT", value: mine ? (mine.hht_no || "") : ""});
          card.appendChild(hht);
        }
        if(role === "auditor"){
          papan = el("input", {type:"text", placeholder:"Nomor papan jalan", value: mine ? (mine.papan_jalan_no || "") : ""});
          card.appendChild(papan);
        }
        if(role !== "counter"){
          idp = el("input", {type:"text", placeholder:"ID participant", value: mine ? (mine.id_participant || "") : ""});
          card.appendChild(idp);
        }
        const btn = el("button", {class:"primary", text: role === "counter" ? (mine ? "Sudah Done" : "Done") : (mine ? "Perbarui registrasi" : "Registrasi")});
        btn.addEventListener("click", ()=>{
          const vals = { hht: hht ? hht.value.trim() : "", papan: papan ? papan.value.trim() : "", idp: idp ? idp.value.trim() : "" };
          if(role === "scanner" && !vals.hht){ setState({soMsg:"Gagal: nomor HHT belum diisi."}); return; }
          if(role === "auditor" && !vals.papan){ setState({soMsg:"Gagal: nomor papan jalan belum diisi."}); return; }
          if(role !== "counter" && !vals.idp){ setState({soMsg:"Gagal: ID participant belum diisi."}); return; }
          submitSO(k, vals);
        });
        card.appendChild(btn);
      }
      if(mine && !mine.dikembalikan && role !== "counter"){
        card.appendChild(el("p", {class:"sub", style:"margin-top:8px;", text:"Sarana bantu wajib dikembalikan ke MMD setelah SO selesai."}));
      }
    }
    wrap.appendChild(card);
  });
  return wrap;
}

// ===== REGISTRASI SO (ADMIN) =====
async function loadAdminSO(){
  setState({adminSOLoading:true});
  try{
    const kegiatan = await sb("so_kegiatan?select=*&order=tanggal.asc");
    const pen = await sb("so_penugasan?select=kegiatan_id,gondola,scanner_nik,scanner_nama,auditor_nik,auditor_nama&limit=5000");
    const reg = await sb("so_registrasi?select=*&order=registered_at.desc&limit=5000");
    const lay = await sb("training_setting?key=eq.layout_url&select=value");
    const kid = state.soKid || (kegiatan[0] ? kegiatan[0].id : null);
    setState({adminSOLoading:false, adminSO:{kegiatan, pen, reg}, soKid:kid, layoutDraft: lay[0] ? (lay[0].value || "") : ""});
  }catch(e){
    setState({adminSOLoading:false, adminMsg:"Gagal memuat data SO."});
  }
}

async function patchSO(path, body, okMsg){
  try{
    await sbPatch(path, body);
    await loadAdminSO();
    setState({adminMsg: okMsg || ""});
  }catch(e){
    setState({adminMsg:"Gagal menyimpan perubahan."});
  }
}

function renderAdminSO(){
  const box = el("div");
  if(state.adminSOLoading || !state.adminSO){
    box.appendChild(el("div", {class:"loading", text:"Memuat data SO..."}));
    return box;
  }
  const {kegiatan, pen, reg} = state.adminSO;
  if(state.adminMsg) box.appendChild(el("div", {class: state.adminMsg.indexOf("Gagal") === 0 ? "error" : "success-text", style:"margin-bottom:10px;", text:state.adminMsg}));

  // link layout
  const lay = el("div", {class:"so-card"});
  lay.appendChild(el("h3", {text:"Link layout"}));
  const li = el("input", {type:"text", placeholder:"https://...", value: state.layoutDraft});
  li.addEventListener("input", e=>{ state.layoutDraft = e.target.value; });
  lay.appendChild(li);
  const lb = el("button", {class:"primary", text:"Simpan link layout"});
  lb.addEventListener("click", ()=> patchSO("training_setting?key=eq.layout_url", { value: li.value.trim(), updated_at: new Date().toISOString() }, "Link layout tersimpan."));
  lay.appendChild(lb);
  box.appendChild(lay);

  // kontrol kegiatan
  kegiatan.forEach(k=>{
    const c = el("div", {class:"so-card"});
    c.appendChild(el("h3", {text:k.nama}));
    const row = el("div", {style:"margin-bottom:8px;"});
    row.appendChild(el("span", {class:"chip " + (k.registrasi_buka ? "good" : "muted"), text: k.registrasi_buka ? "Registrasi DIBUKA" : "Registrasi ditutup"}));
    row.appendChild(el("span", {class:"chip", text: k.sesi_aktif ? "Sesi " + SESI_LABEL[k.sesi_aktif] : "Sesi belum ditentukan"}));
    c.appendChild(row);
    c.appendChild(selectEl([["","Sesi belum ditentukan"],["backroom","Sesi Backroom"],["selling","Sesi Selling"]], k.sesi_aktif || "", v=> patchSO("so_kegiatan?id=eq." + k.id, { sesi_aktif: v || null }, "Sesi " + k.nama + " diubah.")));
    const tb = el("button", {class: k.registrasi_buka ? "ghost" : "primary", style:"margin-top:8px;", text: k.registrasi_buka ? "Tutup registrasi" : "Buka registrasi"});
    tb.addEventListener("click", ()=> patchSO("so_kegiatan?id=eq." + k.id, { registrasi_buka: !k.registrasi_buka }, k.registrasi_buka ? "Registrasi ditutup." : "Registrasi dibuka."));
    c.appendChild(tb);
    box.appendChild(c);
  });

  // daftar registrasi
  const cur = kegiatan.find(k=> k.id === state.soKid) || kegiatan[0];
  if(!cur) return box;
  const sesi = state.soSesi || cur.sesi_aktif || "backroom";
  const filters = el("div", {class:"filters"});
  filters.appendChild(selectEl(kegiatan.map(k=> [String(k.id), k.nama]), String(cur.id), v=> setState({soKid:Number(v), adminMsg:""})));
  filters.appendChild(selectEl([["backroom","Backroom"],["selling","Selling"]], sesi, v=> setState({soSesi:v, adminMsg:""})));
  box.appendChild(filters);

  const expected = {};
  pen.filter(p=> p.kegiatan_id === cur.id).forEach(p=>{
    if(p.scanner_nik) expected["scanner|" + p.scanner_nik] = {role:"scanner", nik:p.scanner_nik, nama:p.scanner_nama};
    if(p.auditor_nik) expected["auditor|" + p.auditor_nik] = {role:"auditor", nik:p.auditor_nik, nama:p.auditor_nama};
  });
  const regHere = reg.filter(r=> r.kegiatan_id === cur.id && r.sesi === sesi);
  const regMap = {}; regHere.forEach(r=>{ regMap[r.role + "|" + r.nik] = r; });
  const belumReg = Object.keys(expected).filter(k=> !regMap[k]).map(k=> expected[k]);
  const belumKembali = regHere.filter(r=> r.role !== "counter" && !r.dikembalikan);

  const stats = el("div", {class:"stat-grid"});
  [["Terdaftar", regHere.length, "var(--good)"],["Belum registrasi", belumReg.length, "var(--bad)"],["Belum kembali", belumKembali.length, "var(--accent)"]].forEach(s=>{
    const st = el("div", {class:"stat"});
    st.appendChild(el("div", {class:"stat-num", text:String(s[1]), style:"color:" + s[2]}));
    st.appendChild(el("div", {class:"stat-label", text:s[0]}));
    stats.appendChild(st);
  });
  box.appendChild(stats);

  const head = cur.nama + " · sesi " + SESI_LABEL[sesi];
  const b1 = el("button", {class:"primary", text:"Salin daftar belum registrasi (" + belumReg.length + ")"});
  b1.addEventListener("click", async ()=>{
    if(!belumReg.length){ setState({adminMsg:"Semua sudah registrasi."}); return; }
    const lines = ["Belum registrasi SO - " + head, ""];
    belumReg.forEach((p,i)=> lines.push((i+1) + ". " + p.nama + " (" + p.nik + ") - " + SECTION_INFO[p.role].label));
    await copyText(lines.join("\n"));
    setState({adminMsg:"Daftar belum registrasi tersalin, tinggal paste ke WhatsApp."});
  });
  box.appendChild(b1);
  const b2 = el("button", {class:"ghost", style:"margin-top:8px;", text:"Salin daftar belum mengembalikan (" + belumKembali.length + ")"});
  b2.addEventListener("click", async ()=>{
    if(!belumKembali.length){ setState({adminMsg:"Semua sarana bantu sudah dikembalikan."}); return; }
    const lines = ["Belum mengembalikan sarana bantu - " + head, ""];
    belumKembali.forEach((r,i)=> lines.push((i+1) + ". " + (r.nama || r.nik) + " (" + r.nik + ") - " + SECTION_INFO[r.role].label + (r.role === "scanner" ? " · HHT " + (r.hht_no || "-") : " · Papan " + (r.papan_jalan_no || "-")) + " · ID " + (r.id_participant || "-")));
    await copyText(lines.join("\n"));
    setState({adminMsg:"Daftar belum mengembalikan tersalin, tinggal paste ke WhatsApp."});
  });
  box.appendChild(b2);

  const list = el("div", {class:"result-list"});
  if(!regHere.length) list.appendChild(el("div", {class:"loading", text:"Belum ada yang registrasi di sesi ini."}));
  regHere.forEach(r=>{
    const info = SECTION_INFO[r.role];
    const item = el("div", {class:"result-item", style:"--c:" + info.color});
    const left = el("div", {class:"result-left"});
    left.appendChild(el("div", {class:"result-name", text:r.nama || r.nik}));
    const det = [r.nik, info.label];
    if(r.hht_no) det.push("HHT " + r.hht_no);
    if(r.papan_jalan_no) det.push("Papan " + r.papan_jalan_no);
    if(r.id_participant) det.push("ID " + r.id_participant);
    left.appendChild(el("div", {class:"result-meta", text:det.join(" · ")}));
    item.appendChild(left);
    if(r.role !== "counter"){
      const tg = el("button", {class:"mini-btn", text: r.dikembalikan ? "Batalkan kembali" : "Tandai kembali"});
      tg.addEventListener("click", ()=> patchSO("so_registrasi?id=eq." + r.id, { dikembalikan: !r.dikembalikan, dikembalikan_at: r.dikembalikan ? null : new Date().toISOString() }, r.dikembalikan ? "Status pengembalian dibatalkan." : "Ditandai sudah dikembalikan."));
      item.appendChild(tg);
    }
    list.appendChild(item);
  });
  box.appendChild(list);
  return box;
}
