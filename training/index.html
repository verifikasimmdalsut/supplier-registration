<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Training Gudang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAFAF8;
    --surface:#FFFFFF;
    --surface-2:#F1F1EC;
    --border:#E3E2DA;
    --ink:#122146;
    --text:#232A3B;
    --text-muted:#6E7488;
    --accent:#F2971D;
    --accent-soft:#FFF1DC;
    --good:#0F7B63;
    --good-soft:#E3F3EE;
    --bad:#C8432F;
    --radius:14px;
    --font-display:"Space Grotesk", -apple-system, sans-serif;
    --font-body:"Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --c-counter:#0F7B63;
    --c-counter-soft:#E3F3EE;
    --c-scanner:#F2971D;
    --c-scanner-soft:#FFF1DC;
    --c-auditor:#122146;
    --c-auditor-soft:#E7EAF2;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:var(--font-body);
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  #app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    padding:24px 20px 40px;
    display:flex;
    flex-direction:column;
  }
  .brand{
    font-size:12px;
    letter-spacing:0.03em;
    color:var(--text-muted);
    margin-bottom:10px;
  }
  .barcode{
    display:flex;
    align-items:flex-end;
    gap:2px;
    height:28px;
    margin-bottom:14px;
  }
  .barcode span{ display:block; width:3px; background:var(--ink); border-radius:1px; }
  h1{ font-family:var(--font-display); color:var(--ink); font-size:25px; font-weight:600; margin:0 0 22px; line-height:1.3; }
  h2{ font-family:var(--font-display); color:var(--ink); font-size:19px; font-weight:600; margin:0 0 6px; }
  p.sub{ color:var(--text-muted); font-size:14px; margin:0 0 20px; line-height:1.5; }

  .section-grid{ display:flex; flex-direction:column; gap:12px; }
  .section-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-left:4px solid var(--c);
    border-radius:10px;
    padding:18px 20px;
    text-align:left;
    color:var(--text);
    cursor:pointer;
    font-family:inherit;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .section-card:active{ transform:scale(0.98); }
  .section-card .label{ font-family:var(--font-display); font-size:17px; font-weight:600; color:var(--ink); }
  .section-card .desc{ font-size:13px; color:var(--text-muted); margin-top:2px; }
  .chev{ color:var(--text-muted); font-size:20px; }

  input[type=text]{
    width:100%;
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--text);
    padding:14px 16px;
    border-radius:10px;
    font-size:16px;
    margin-bottom:12px;
  }
  input[type=text]:focus{ outline:none; border-color:var(--accent); }

  select{
    width:100%;
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--text);
    padding:14px 16px;
    border-radius:10px;
    font-size:16px;
    margin-bottom:12px;
  }

  button.primary{
    width:100%;
    background:var(--accent);
    color:#2B1900;
    border:none;
    padding:15px 16px;
    border-radius:10px;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    margin-top:4px;
  }
  button.primary:active{ transform:scale(0.98); }
  button.primary:disabled{ opacity:0.45; cursor:default; }
  button.ghost{
    width:100%;
    background:transparent;
    color:var(--text-muted);
    border:1px solid var(--border);
    padding:13px 16px;
    border-radius:10px;
    font-size:14px;
    cursor:pointer;
    margin-top:10px;
  }
  button.link{
    background:none;
    border:none;
    color:var(--text-muted);
    font-size:13px;
    text-decoration:underline;
    cursor:pointer;
    padding:0;
    margin-top:auto;
    align-self:center;
  }

  .error{ color:var(--bad); font-size:13px; margin:-6px 0 12px; }
  .success-text{ color:var(--good); font-size:13px; margin:-6px 0 12px; }

  .top-nav{ display:flex; align-items:center; gap:10px; margin-bottom:20px; }
  .back{ background:none; border:none; color:var(--text-muted); font-size:22px; cursor:pointer; padding:0; line-height:1; }

  .tag{
    display:inline-block;
    font-family:var(--font-display);
    font-size:12px;
    font-weight:600;
    padding:5px 12px;
    border-radius:20px;
    margin-bottom:14px;
  }

  .materi-box{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:20px;
    font-size:15px;
    line-height:1.7;
    white-space:pre-wrap;
    margin-bottom:20px;
    flex:1;
  }

  .menu-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-left:4px solid var(--c, var(--border));
    border-radius:10px;
    padding:16px 18px;
    margin-bottom:12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  .menu-card.disabled{ opacity:0.5; }
  .menu-left{ display:flex; flex-direction:column; }
  .menu-title{ font-family:var(--font-display); font-size:16px; font-weight:600; color:var(--ink); }
  .menu-desc{ font-size:12px; color:var(--text-muted); margin-top:3px; }
  .menu-btn{
    background:var(--accent);
    color:#2B1900;
    border:none;
    padding:9px 16px;
    border-radius:8px;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    white-space:nowrap;
    font-family:var(--font-body);
  }
  .menu-btn:disabled{ background:var(--surface-2); color:var(--text-muted); cursor:default; }
  .menu-btn.done{ background:var(--good-soft); color:var(--good); }
  .badge-score{
    font-family:var(--font-display);
    font-size:13px;
    font-weight:600;
    color:var(--good);
    background:var(--good-soft);
    padding:5px 12px;
    border-radius:20px;
  }

  .soal-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:18px;
    margin-bottom:14px;
  }
  .soal-num{ font-size:13px; color:var(--text-muted); margin-bottom:6px; }
  .soal-teks{ font-size:16px; font-weight:600; margin-bottom:14px; line-height:1.4; }
  .pilihan{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:12px 14px;
    border:1px solid var(--border);
    border-radius:10px;
    margin-bottom:8px;
    cursor:pointer;
    background:var(--surface);
  }
  .pilihan.selected{ border-color:var(--accent); background:var(--accent-soft); }
  .pilihan .huruf{
    width:22px; height:22px; border-radius:50%;
    border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:700; color:var(--text-muted);
    flex-shrink:0; background:var(--surface);
  }
  .pilihan.selected .huruf{ background:var(--accent); border-color:var(--accent); color:#2B1900; }
  .pilihan .teks{ font-size:14px; line-height:1.5; }

  .center-flex{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
  .score-circle{
    width:164px; height:164px; border-radius:50%;
    border:2px dashed var(--accent);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    margin-bottom:20px; background:var(--accent-soft);
    position:relative;
  }
  .score-circle::before{
    content:"";
    position:absolute; inset:10px;
    border-radius:50%;
    background:var(--surface);
    border:1px solid var(--border);
  }
  .score-num{ font-family:var(--font-display); font-size:42px; font-weight:600; color:var(--ink); position:relative; }
  .score-label{ font-size:11px; letter-spacing:0.04em; color:var(--text-muted); margin-top:2px; position:relative; }

  .loading{ text-align:center; color:var(--text-muted); padding:40px 0; font-size:14px; }

  .progress-bar{ height:4px; background:var(--surface-2); border-radius:2px; margin-bottom:20px; overflow:hidden; }
  .progress-fill{ height:100%; background:var(--accent); transition:width .2s ease; }


  .barcode.small{ height:18px; margin-bottom:10px; }
  .tabs{ display:flex; gap:6px; margin:14px 0 18px; border-bottom:1px solid var(--border); }
  .tab{
    background:none; border:none; padding:10px 12px; font-family:var(--font-display);
    font-size:14px; font-weight:600; color:var(--text-muted); cursor:pointer;
    border-bottom:3px solid transparent; margin-bottom:-1px;
  }
  .tab.active{ color:var(--ink); border-bottom-color:var(--accent); }
  .stat-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:16px; }
  .stat-grid.two{ grid-template-columns:repeat(2,1fr); }
  .stat{ background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px 12px; }
  .stat-num{ font-family:var(--font-display); font-size:28px; font-weight:600; line-height:1; }
  .stat-label{ font-size:12px; color:var(--text-muted); margin-top:6px; }
  .filters{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:12px; }
  .filters.one{ grid-template-columns:1fr; }
  .filters select{ margin-bottom:0; padding:11px 10px; font-size:14px; }
  .result-list{ margin-top:16px; }
  .result-item{
    background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--c, var(--border));
    border-radius:10px; padding:12px 14px; margin-bottom:8px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .result-name{ font-family:var(--font-display); font-size:15px; font-weight:600; color:var(--ink); }
  .result-meta{ font-size:12px; color:var(--text-muted); margin-top:3px; }
  .result-right{ display:flex; align-items:center; gap:8px; flex-shrink:0; }
  .nilai-badge{ font-family:var(--font-display); font-weight:600; font-size:15px; min-width:44px; text-align:center; padding:6px 10px; border-radius:8px; }
  .nilai-badge.pass{ background:var(--good-soft); color:var(--good); }
  .nilai-badge.fail{ background:#FBE7E3; color:var(--bad); }
  .mini-btn{ background:var(--surface); border:1px solid var(--border); color:var(--ink); font-size:12px; font-weight:600; padding:7px 10px; border-radius:8px; cursor:pointer; font-family:var(--font-body); }
  .admin-field label{ font-size:13px; font-weight:600; color:var(--text-muted); display:block; margin-bottom:6px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
const SUPABASE_URL = "https://akrjxgtevgwadhslkhee.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFrcmp4Z3Rldmd3YWRoc2xraGVlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM5NjQ3MzUsImV4cCI6MjA5OTU0MDczNX0.BVPsD3zyEy4fv-Ihy2JiFcgyx1l6hBGta0xVA08nnDg";
const ADMIN_PASSCODE = "gudang123"; // ganti sesuai kebutuhan, ini cuma pengaman ringan untuk prototype

async function sb(path){
  const res = await fetch(SUPABASE_URL + "/rest/v1/" + path, {
    headers:{ "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY }
  });
  if(!res.ok) throw new Error("Gagal ambil data");
  return res.json();
}
async function sbInsert(table, body){
  const res = await fetch(SUPABASE_URL + "/rest/v1/" + table, {
    method:"POST",
    headers:{ "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY, "Content-Type":"application/json", "Prefer":"return=minimal" },
    body: JSON.stringify(body)
  });
  if(!res.ok) throw new Error("Gagal simpan data");
}
async function sbUpsert(table, body, conflictCols){
  const res = await fetch(SUPABASE_URL + "/rest/v1/" + table + "?on_conflict=" + conflictCols, {
    method:"POST",
    headers:{ "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY, "Content-Type":"application/json", "Prefer":"resolution=merge-duplicates,return=minimal" },
    body: JSON.stringify(body)
  });
  if(!res.ok) throw new Error("Gagal update data");
}

const SECTION_INFO = {
  counter: { label:"Counter", desc:"Login pakai nama, tanpa NIK", color:"var(--c-counter)", soft:"var(--c-counter-soft)" },
  scanner: { label:"Scanner", desc:"Login pakai NIK terdaftar", color:"var(--c-scanner)", soft:"var(--c-scanner-soft)" },
  auditor: { label:"Auditor", desc:"Login pakai NIK terdaftar", color:"var(--c-auditor)", soft:"var(--c-auditor-soft)" }
};
const JENIS_INFO = {
  pretest: { label:"Pre Test", desc:"Dikerjakan sebelum materi selesai dievaluasi" },
  posttest: { label:"Post Test", desc:"Dikerjakan setelah materi selesai dipelajari" }
};

let state = {
  screen: "home",
  section: null,
  nama: "",
  nik: "",
  identifier: "",
  inputVal: "",
  inputBrand: "",
  inputDept: "",
  brand: "",
  departemen: "",
  errorMsg: "",
  loading: false,
  modul: null,
  progress: { sudah_baca_materi:false },
  locks: {
    pretest: { selesai:false, boleh_ulang:false, nilai:null },
    posttest: { selesai:false, boleh_ulang:false, nilai:null }
  },
  currentJenis: null,
  soalList: [],
  jawaban: {},
  hasil: null,
  adminAuthed: false,
  adminPasscodeInput: "",
  adminSection: "scanner",
  adminIdentifier: "",
  adminJenis: "pretest",
  adminMsg: "",
  adminLoading: false,
  adminTab: "hasil",
  adminData: null,
  adminDataLoading: false,
  fSection: "all",
  fJenis: "all",
  fStatus: "all"
};

function setState(patch){ state = Object.assign({}, state, patch); render(); }

function render(){
  const app = document.getElementById("app");
  app.innerHTML = "";
  app.style.maxWidth = (state.screen === "admin" && state.adminAuthed) ? "760px" : "480px";
  if(state.screen === "home") app.appendChild(renderHome());
  else if(state.screen === "login") app.appendChild(renderLogin());
  else if(state.screen === "dashboard") app.appendChild(renderDashboard());
  else if(state.screen === "materi") app.appendChild(renderMateri());
  else if(state.screen === "kuis") app.appendChild(renderKuis());
  else if(state.screen === "hasil") app.appendChild(renderHasil());
  else if(state.screen === "admin") app.appendChild(renderAdmin());
}

function el(tag, props, children){
  const e = document.createElement(tag);
  if(props) for(const k in props){
    if(k === "class") e.className = props[k];
    else if(k === "text") e.textContent = props[k];
    else if(k.startsWith("on")) e.addEventListener(k.slice(2).toLowerCase(), props[k]);
    else if(props[k] === null || props[k] === undefined || props[k] === false) e.removeAttribute(k);
    else e.setAttribute(k, props[k]);
  }
  if(children) children.forEach(c => c && e.appendChild(c));
  return e;
}

function isCounter(){ return state.section === "counter"; }

function tagEl(text, info){
  return el("div", {class:"tag", text:text, style:"background:" + info.soft + ";color:" + info.color + ";"});
}

function barcodeEl(){
  const bar = el("div", {class:"barcode"});
  const widths = [2,1,3,1,2,4,1,2,1,3,2,1,4,1,2,3,1,2];
  widths.forEach((w,i)=>{
    const h = 14 + ((i*7) % 14);
    bar.appendChild(el("span", {style:"width:" + w + "px;height:" + h + "px;"}));
  });
  return bar;
}

function renderHome(){
  const wrap = el("div");
  wrap.appendChild(barcodeEl());
  wrap.appendChild(el("div", {class:"brand", text:"Training gudang"}));
  wrap.appendChild(el("h1", {text:"Pilih bagian yang kamu ikuti"}));
  const grid = el("div", {class:"section-grid"});
  ["counter","scanner","auditor"].forEach(key=>{
    const info = SECTION_INFO[key];
    const card = el("button", { class:"section-card", style:"--c:" + info.color, onClick: ()=> setState({screen:"login", section:key, inputVal:"", inputBrand:"", inputDept:"", errorMsg:""}) });
    const left = el("div");
    left.appendChild(el("div", {class:"label", text:info.label}));
    left.appendChild(el("div", {class:"desc", text:info.desc}));
    card.appendChild(left);
    card.appendChild(el("span", {class:"chev", text:"\u203a"}));
    grid.appendChild(card);
  });
  wrap.appendChild(grid);
  wrap.appendChild(el("button", {class:"link", text:"Masuk sebagai admin", onClick: ()=> setState({screen:"admin", adminMsg:""})}));
  return wrap;
}

function renderLogin(){
  const info = SECTION_INFO[state.section];
  const wrap = el("div");
  const nav = el("div", {class:"top-nav"});
  nav.appendChild(el("button", {class:"back", text:"\u2190", onClick:()=> setState({screen:"home", errorMsg:""})}));
  wrap.appendChild(nav);
  wrap.appendChild(tagEl(info.label, info));

  const counterMode = isCounter();
  wrap.appendChild(el("h2", {text: counterMode ? "Isi data diri kamu" : "Masukkan NIK kamu"}));
  wrap.appendChild(el("p", {class:"sub", text: counterMode
    ? "Data ini dipakai untuk mencatat progres dan nilai kamu."
    : "NIK kamu akan dicocokkan ke daftar peserta " + info.label + "."}));

  const input = el("input", { type:"text", placeholder: counterMode ? "Nama lengkap" : "Contoh: 3201xxxxxxxx", value: state.inputVal });
  input.addEventListener("input", e => { state.inputVal = e.target.value; });
  wrap.appendChild(input);

  let brandInput = null, deptInput = null;
  if(counterMode){
    brandInput = el("input", { type:"text", placeholder:"Brand", value: state.inputBrand });
    brandInput.addEventListener("input", e => { state.inputBrand = e.target.value; });
    wrap.appendChild(brandInput);
    deptInput = el("input", { type:"text", placeholder:"Departemen", value: state.inputDept });
    deptInput.addEventListener("input", e => { state.inputDept = e.target.value; });
    wrap.appendChild(deptInput);
  }

  if(state.errorMsg) wrap.appendChild(el("div", {class:"error", text: state.errorMsg}));

  const btn = el("button", { class:"primary", text: state.loading ? "Memeriksa..." : "Lanjut", disabled: state.loading });
  btn.addEventListener("click", async ()=>{
    const val = input.value.trim();
    if(!val){ setState({errorMsg: counterMode ? "Nama belum diisi." : "NIK belum diisi."}); return; }
    if(counterMode){
      const br = brandInput.value.trim(), dp = deptInput.value.trim();
      if(!br){ setState({errorMsg:"Brand belum diisi."}); return; }
      if(!dp){ setState({errorMsg:"Departemen belum diisi."}); return; }
      setState({nama: val, nik:"", identifier: val, brand: br, departemen: dp, errorMsg:""});
      loadDashboard();
      return;
    }
    setState({loading:true, errorMsg:""});
    try{
      const rows = await sb("training_peserta_nik?nik=eq." + encodeURIComponent(val) + "&section=eq." + state.section + "&select=nama,nik");
      if(rows.length === 0){
        setState({loading:false, errorMsg:"NIK tidak terdaftar untuk bagian " + info.label + "."});
        return;
      }
      setState({loading:false, nama: rows[0].nama, nik: rows[0].nik, identifier: rows[0].nik});
      loadDashboard();
    }catch(err){
      setState({loading:false, errorMsg:"Gagal memeriksa NIK. Coba lagi."});
    }
  });
  wrap.appendChild(btn);
  setTimeout(()=> input.focus(), 50);
  return wrap;
}

async function loadDashboard(){
  setState({loading:true, screen:"dashboard"});
  try{
    const progRows = await sb("training_progress?section=eq." + state.section + "&identifier=eq." + encodeURIComponent(state.identifier) + "&select=sudah_baca_materi");
    const lockRows = await sb("training_test_lock?section=eq." + state.section + "&identifier=eq." + encodeURIComponent(state.identifier) + "&select=jenis,selesai,boleh_ulang");
    const hasilRows = await sb("training_hasil?section=eq." + state.section + "&identifier=eq." + encodeURIComponent(state.identifier) + "&select=jenis,nilai,selesai_at&order=selesai_at.desc");

    const locks = { pretest:{selesai:false, boleh_ulang:false, nilai:null}, posttest:{selesai:false, boleh_ulang:false, nilai:null} };
    lockRows.forEach(r=>{ locks[r.jenis].selesai = r.selesai; locks[r.jenis].boleh_ulang = r.boleh_ulang; });
    ["pretest","posttest"].forEach(j=>{
      const found = hasilRows.find(h => h.jenis === j);
      if(found) locks[j].nilai = found.nilai;
    });

    setState({
      loading:false,
      progress: { sudah_baca_materi: progRows.length ? progRows[0].sudah_baca_materi : false },
      locks
    });
  }catch(err){
    setState({loading:false});
  }
}

function renderDashboard(){
  const info = SECTION_INFO[state.section];
  const wrap = el("div");
  const nav = el("div", {class:"top-nav"});
  nav.appendChild(el("button", {class:"back", text:"\u2190", onClick:()=> setState({screen:"home", section:null, nama:"", nik:"", identifier:"", brand:"", departemen:"", inputVal:"", inputBrand:"", inputDept:""})}));
  wrap.appendChild(nav);
  wrap.appendChild(tagEl(info.label + " \u00b7 " + state.nama, info));
  wrap.appendChild(el("h2", {text:"Menu training"}));

  if(state.loading){
    wrap.appendChild(el("div", {class:"loading", text:"Memuat status..."}));
    return wrap;
  }

  wrap.appendChild(el("p", {class:"sub", text:"Pre Test bisa langsung dikerjakan. Post Test baru bisa diisi setelah Pre Test selesai."}));

  // Materi card
  const materiCard = el("div", {class:"menu-card", style:"--c:" + info.color});
  const materiLeft = el("div", {class:"menu-left"});
  materiLeft.appendChild(el("div", {class:"menu-title", text:"Materi"}));
  materiLeft.appendChild(el("div", {class:"menu-desc", text: state.progress.sudah_baca_materi ? "Sudah dibaca" : "Belum dibaca"}));
  materiCard.appendChild(materiLeft);
  const materiBtn = el("button", {class:"menu-btn" + (state.progress.sudah_baca_materi ? " done" : ""), text: state.progress.sudah_baca_materi ? "Baca lagi" : "Buka"});
  materiBtn.addEventListener("click", ()=>{ setState({screen:"materi"}); loadMateri(); });
  materiCard.appendChild(materiBtn);
  wrap.appendChild(materiCard);

  // Pretest & Posttest cards
  const pretestDone = state.locks.pretest.selesai && !state.locks.pretest.boleh_ulang;
  ["pretest","posttest"].forEach(jenis=>{
    const jinfo = JENIS_INFO[jenis];
    const lock = state.locks[jenis];
    const gatedByPretest = jenis === "posttest" && !pretestDone && !(lock.selesai && !lock.boleh_ulang);
    const card = el("div", {class:"menu-card" + (gatedByPretest ? " disabled" : ""), style:"--c:" + info.color});
    const left = el("div", {class:"menu-left"});
    left.appendChild(el("div", {class:"menu-title", text: jinfo.label}));
    let desc = jinfo.desc;
    if(gatedByPretest) desc = "Selesaikan Pre Test dulu";
    else if(lock.selesai && !lock.boleh_ulang) desc = "Sudah dikerjakan, hubungi admin untuk mengulang";
    else if(lock.selesai && lock.boleh_ulang) desc = "Sudah dibuka admin untuk mengulang";
    left.appendChild(el("div", {class:"menu-desc", text: desc}));
    card.appendChild(left);

    if(lock.selesai && !lock.boleh_ulang){
      card.appendChild(el("div", {class:"badge-score", text:"Nilai " + (lock.nilai != null ? lock.nilai : "-")}));
    } else {
      const canOpen = !gatedByPretest;
      const btnText = lock.selesai && lock.boleh_ulang ? "Ulang" : "Mulai";
      const btn = el("button", {class:"menu-btn", text: btnText, disabled: !canOpen});
      if(canOpen){
        btn.addEventListener("click", ()=>{ setState({currentJenis: jenis}); loadKuis(); });
      }
      card.appendChild(btn);
    }
    wrap.appendChild(card);
  });

  return wrap;
}

async function loadMateri(){
  setState({loading:true});
  try{
    const rows = await sb("training_modul?section=eq." + state.section + "&select=judul,konten");
    setState({loading:false, modul: rows[0] || {judul:"Materi belum tersedia", konten:"Materi untuk bagian ini belum diisi admin."}});
  }catch(err){
    setState({loading:false, modul: {judul:"Gagal memuat materi", konten:"Terjadi kesalahan saat mengambil materi. Coba lagi."}});
  }
}

function renderMateri(){
  const info = SECTION_INFO[state.section];
  const wrap = el("div");
  const nav = el("div", {class:"top-nav"});
  nav.appendChild(el("button", {class:"back", text:"\u2190", onClick:()=> setState({screen:"dashboard"})}));
  wrap.appendChild(nav);
  wrap.appendChild(tagEl(info.label + " \u00b7 " + state.nama, info));

  if(state.loading || !state.modul){
    wrap.appendChild(el("div", {class:"loading", text:"Memuat materi..."}));
    return wrap;
  }
  wrap.appendChild(el("h2", {text: state.modul.judul}));
  wrap.appendChild(el("div", {class:"materi-box", text: state.modul.konten}));

  const btn = el("button", {class:"primary", text: state.progress.sudah_baca_materi ? "Kembali ke menu" : "Saya sudah baca materi ini", disabled: state.loading});
  btn.addEventListener("click", async ()=>{
    if(state.progress.sudah_baca_materi){ setState({screen:"dashboard"}); return; }
    setState({loading:true});
    try{
      await sbUpsert("training_progress", { section: state.section, identifier: state.identifier, sudah_baca_materi: true }, "section,identifier");
    }catch(err){ /* tetap lanjut walau gagal simpan status */ }
    setState({loading:false, progress:{sudah_baca_materi:true}, screen:"dashboard"});
  });
  wrap.appendChild(btn);
  return wrap;
}

async function loadKuis(){
  setState({loading:true, screen:"kuis", jawaban:{}});
  try{
    const rows = await sb("training_soal?section=eq." + state.section + "&select=id,pertanyaan,pilihan_a,pilihan_b,pilihan_c,pilihan_d,jawaban_benar&order=urutan.asc");
    setState({loading:false, soalList: rows});
  }catch(err){
    setState({loading:false, soalList: []});
  }
}

function renderKuis(){
  const info = SECTION_INFO[state.section];
  const jinfo = JENIS_INFO[state.currentJenis];
  const wrap = el("div");
  wrap.appendChild(tagEl(info.label + " \u00b7 " + jinfo.label, info));

  if(state.loading){
    wrap.appendChild(el("div", {class:"loading", text:"Memuat soal..."}));
    return wrap;
  }
  if(state.soalList.length === 0){
    wrap.appendChild(el("h2", {text:"Soal belum tersedia"}));
    wrap.appendChild(el("p", {class:"sub", text:"Admin belum menambahkan soal untuk bagian ini."}));
    wrap.appendChild(el("button", {class:"ghost", text:"Kembali ke menu", onClick:()=> setState({screen:"dashboard"})}));
    return wrap;
  }

  const answered = Object.keys(state.jawaban).length;
  const total = state.soalList.length;
  wrap.appendChild(el("h2", {text: jinfo.label + " " + info.label}));
  wrap.appendChild(el("p", {class:"sub", text: answered + " dari " + total + " soal terjawab \u00b7 hanya bisa dikerjakan sekali"}));
  const bar = el("div", {class:"progress-bar"});
  bar.appendChild(el("div", {class:"progress-fill", style:"width:" + Math.round(answered/total*100) + "%"}));
  wrap.appendChild(bar);

  state.soalList.forEach((soal, idx)=>{
    const card = el("div", {class:"soal-card"});
    card.appendChild(el("div", {class:"soal-num", text:"Soal " + (idx+1) + " dari " + total}));
    card.appendChild(el("div", {class:"soal-teks", text: soal.pertanyaan}));
    ["a","b","c","d"].forEach(letter=>{
      const teks = soal["pilihan_" + letter];
      if(!teks) return;
      const isSel = state.jawaban[soal.id] === letter.toUpperCase();
      const opt = el("div", {class:"pilihan" + (isSel ? " selected" : "")});
      opt.appendChild(el("div", {class:"huruf", text: letter.toUpperCase()}));
      opt.appendChild(el("div", {class:"teks", text: teks}));
      opt.addEventListener("click", ()=>{ state.jawaban[soal.id] = letter.toUpperCase(); render(); });
      card.appendChild(opt);
    });
    wrap.appendChild(card);
  });

  if(state.errorMsg) wrap.appendChild(el("div", {class:"error", text: state.errorMsg}));

  const btn = el("button", {class:"primary", text: state.loading ? "Menyimpan..." : "Selesai, kirim jawaban"});
  btn.addEventListener("click", submitKuis);
  wrap.appendChild(btn);
  return wrap;
}

async function submitKuis(){
  const total = state.soalList.length;
  const answered = Object.keys(state.jawaban).length;
  if(answered < total){
    setState({errorMsg:"Masih ada " + (total - answered) + " soal yang belum dijawab."});
    return;
  }
  let benar = 0;
  state.soalList.forEach(soal=>{ if(state.jawaban[soal.id] === soal.jawaban_benar) benar++; });
  const nilai = Math.round((benar/total)*100);
  setState({loading:true, errorMsg:""});
  try{
    await sbInsert("training_hasil", {
      section: state.section, nama: state.nama, nik: state.nik || null, identifier: state.identifier,
      jenis: state.currentJenis, benar: benar, total: total, nilai: nilai,
      brand: state.brand || null, departemen: state.departemen || null
    });
    await sbUpsert("training_test_lock", {
      section: state.section, identifier: state.identifier, jenis: state.currentJenis,
      selesai: true, boleh_ulang: false
    }, "section,identifier,jenis");
  }catch(err){ /* tetap tampilkan nilai walau gagal simpan */ }
  const locks = Object.assign({}, state.locks);
  locks[state.currentJenis] = { selesai:true, boleh_ulang:false, nilai:nilai };
  setState({loading:false, screen:"hasil", hasil:{benar, total, nilai}, locks});
}

function renderHasil(){
  const info = SECTION_INFO[state.section];
  const jinfo = JENIS_INFO[state.currentJenis];
  const wrap = el("div", {class:"center-flex"});
  const h = state.hasil;
  const circle = el("div", {class:"score-circle"});
  circle.appendChild(el("div", {class:"score-num", text: h.nilai}));
  circle.appendChild(el("div", {class:"score-label", text:"NILAI"}));
  wrap.appendChild(circle);
  wrap.appendChild(el("h2", {text: jinfo.label + " selesai, " + state.nama}));
  wrap.appendChild(el("p", {class:"sub", text: h.benar + " dari " + h.total + " jawaban benar \u00b7 Bagian " + info.label}));
  const btn = el("button", {class:"ghost", text:"Kembali ke menu"});
  btn.addEventListener("click", ()=> setState({screen:"dashboard", hasil:null, currentJenis:null}));
  wrap.appendChild(btn);
  return wrap;
}

// ---------- ADMIN ----------
const PASS_GRADE = 80;

async function loadAdminData(){
  setState({adminDataLoading:true});
  try{
    const hasil = await sb("training_hasil?select=nama,identifier,section,jenis,nilai,selesai_at,brand,departemen&order=selesai_at.desc&limit=5000");
    const peserta = await sb("training_peserta_nik?select=nik,nama,section&limit=5000");
    setState({adminDataLoading:false, adminData:{hasil, peserta}});
  }catch(err){
    setState({adminDataLoading:false, adminMsg:"Gagal memuat data nilai."});
  }
}

function latestResults(){
  // ambil percobaan terbaru per (section, identifier, jenis)
  const seen = {};
  const out = [];
  state.adminData.hasil.forEach(h=>{
    const k = h.section + "|" + h.identifier + "|" + h.jenis;
    if(!seen[k]){ seen[k] = true; out.push(h); }
  });
  return out;
}

function fmtTanggal(iso){
  const d = new Date(iso);
  return d.toLocaleDateString("id-ID", {day:"2-digit", month:"short"}) + " " +
         d.toLocaleTimeString("id-ID", {hour:"2-digit", minute:"2-digit"});
}

function copyText(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    return navigator.clipboard.writeText(text);
  }
  const ta = document.createElement("textarea");
  ta.value = text; document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); }catch(e){}
  document.body.removeChild(ta);
  return Promise.resolve();
}

function selectEl(options, current, onChange){
  const s = el("select");
  options.forEach(o=>{
    const opt = el("option", {value:o[0], text:o[1]});
    if(current === o[0]) opt.setAttribute("selected","true");
    s.appendChild(opt);
  });
  s.addEventListener("change", e=> onChange(e.target.value));
  return s;
}

function renderAdmin(){
  const wrap = el("div");
  const nav = el("div", {class:"top-nav"});
  nav.appendChild(el("button", {class:"back", text:"\u2190", onClick:()=> setState({screen:"home", adminAuthed:false, adminPasscodeInput:"", adminMsg:""})}));
  wrap.appendChild(nav);

  if(!state.adminAuthed){
    wrap.appendChild(el("h2", {text:"Masuk admin"}));
    wrap.appendChild(el("p", {class:"sub", text:"Masukkan kode admin untuk melihat nilai peserta dan membuka kunci remedial."}));
    const input = el("input", {type:"text", placeholder:"Kode admin", value: state.adminPasscodeInput});
    input.addEventListener("input", e=>{ state.adminPasscodeInput = e.target.value; });
    wrap.appendChild(input);
    if(state.adminMsg) wrap.appendChild(el("div", {class:"error", text: state.adminMsg}));
    const btn = el("button", {class:"primary", text:"Masuk"});
    btn.addEventListener("click", ()=>{
      if(input.value.trim() === ADMIN_PASSCODE){
        setState({adminAuthed:true, adminMsg:"", adminTab:"hasil"});
        loadAdminData();
      } else setState({adminMsg:"Kode admin salah."});
    });
    wrap.appendChild(btn);
    return wrap;
  }

  { const bc = barcodeEl(); bc.classList.add("small"); wrap.appendChild(bc); }
  wrap.appendChild(el("h2", {text:"Panel admin"}));

  const tabs = el("div", {class:"tabs"});
  [["hasil","Nilai peserta"],["belum","Belum hadir"],["kunci","Buka kunci"]].forEach(t=>{
    const b = el("button", {class:"tab" + (state.adminTab === t[0] ? " active" : ""), text:t[1]});
    b.addEventListener("click", ()=> setState({adminTab:t[0], adminMsg:""}));
    tabs.appendChild(b);
  });
  wrap.appendChild(tabs);

  if(state.adminTab === "kunci") wrap.appendChild(renderAdminKunci());
  else if(state.adminDataLoading || !state.adminData) wrap.appendChild(el("div", {class:"loading", text:"Memuat data..."}));
  else if(state.adminTab === "belum") wrap.appendChild(renderAdminBelum());
  else wrap.appendChild(renderAdminHasil());
  return wrap;
}

function renderAdminHasil(){
  const box = el("div");
  const all = latestResults();

  // filter
  let rows = all.filter(r =>
    (state.fSection === "all" || r.section === state.fSection) &&
    (state.fJenis === "all" || r.jenis === state.fJenis) &&
    (state.fStatus === "all" || (state.fStatus === "lulus" ? r.nilai >= PASS_GRADE : r.nilai < PASS_GRADE))
  );
  rows.sort((a,b)=> a.nilai - b.nilai);

  const hadirIds = {};
  state.adminData.hasil.forEach(h=>{ hadirIds[h.section + "|" + h.identifier] = true; });
  const totalHadir = Object.keys(hadirIds).length;
  const remedial = all.filter(r=> r.nilai < PASS_GRADE);
  const lulus = all.length - remedial.length;

  const stats = el("div", {class:"stat-grid"});
  [["Peserta hadir", totalHadir, "var(--ink)"],["Lulus (\u2265" + PASS_GRADE + ")", lulus, "var(--good)"],["Perlu remedial", remedial.length, "var(--bad)"]].forEach(s=>{
    const c = el("div", {class:"stat"});
    c.appendChild(el("div", {class:"stat-num", text:String(s[1]), style:"color:" + s[2]}));
    c.appendChild(el("div", {class:"stat-label", text:s[0]}));
    stats.appendChild(c);
  });
  box.appendChild(stats);

  const filters = el("div", {class:"filters"});
  filters.appendChild(selectEl([["all","Semua section"],["counter","Counter"],["scanner","Scanner"],["auditor","Auditor"]], state.fSection, v=> setState({fSection:v})));
  filters.appendChild(selectEl([["all","Semua test"],["pretest","Pre Test"],["posttest","Post Test"]], state.fJenis, v=> setState({fJenis:v})));
  filters.appendChild(selectEl([["all","Semua status"],["lulus","Lulus"],["remedial","Remedial"]], state.fStatus, v=> setState({fStatus:v})));
  box.appendChild(filters);

  if(state.adminMsg) box.appendChild(el("div", {class: state.adminMsg.startsWith("Berhasil") || state.adminMsg.startsWith("Daftar") ? "success-text" : "error", text: state.adminMsg}));

  const copyBtn = el("button", {class:"primary", text:"Salin daftar remedial (" + remedial.filter(r=> (state.fSection==="all"||r.section===state.fSection) && (state.fJenis==="all"||r.jenis===state.fJenis)).length + ")"});
  copyBtn.addEventListener("click", async ()=>{
    const list = remedial.filter(r=> (state.fSection==="all"||r.section===state.fSection) && (state.fJenis==="all"||r.jenis===state.fJenis));
    if(!list.length){ setState({adminMsg:"Tidak ada peserta remedial pada filter ini."}); return; }
    const lines = ["Daftar remedial (nilai < " + PASS_GRADE + ")", ""];
    list.forEach((r,i)=>{
      lines.push((i+1) + ". " + r.nama + " (" + (r.section === "counter" ? (r.brand || "-") + " / " + (r.departemen || "-") : r.identifier) + ") - " + SECTION_INFO[r.section].label + " " + JENIS_INFO[r.jenis].label + ": " + r.nilai);
    });
    await copyText(lines.join("\n"));
    setState({adminMsg:"Daftar remedial tersalin, tinggal paste ke WhatsApp."});
  });
  box.appendChild(copyBtn);

  const list = el("div", {class:"result-list"});
  if(rows.length === 0){
    list.appendChild(el("div", {class:"loading", text:"Belum ada data untuk filter ini."}));
  }
  rows.forEach(r=>{
    const info = SECTION_INFO[r.section];
    const item = el("div", {class:"result-item", style:"--c:" + info.color});
    const left = el("div", {class:"result-left"});
    left.appendChild(el("div", {class:"result-name", text:r.nama}));
    left.appendChild(el("div", {class:"result-meta", text: (r.section === "counter" && (r.brand || r.departemen) ? (r.brand || "-") + " / " + (r.departemen || "-") : r.identifier) + " \u00b7 " + info.label + " \u00b7 " + JENIS_INFO[r.jenis].label + " \u00b7 " + fmtTanggal(r.selesai_at)}));
    item.appendChild(left);
    const right = el("div", {class:"result-right"});
    const pass = r.nilai >= PASS_GRADE;
    right.appendChild(el("div", {class:"nilai-badge " + (pass ? "pass" : "fail"), text:String(r.nilai)}));
    if(!pass){
      const ub = el("button", {class:"mini-btn", text:"Buka kunci"});
      ub.addEventListener("click", async ()=>{
        try{
          await sbUpsert("training_test_lock", {section:r.section, identifier:r.identifier, jenis:r.jenis, selesai:true, boleh_ulang:true}, "section,identifier,jenis");
          setState({adminMsg:"Berhasil: " + r.nama + " bisa mengulang " + JENIS_INFO[r.jenis].label + "."});
        }catch(err){ setState({adminMsg:"Gagal membuka kunci."}); }
      });
      right.appendChild(ub);
    }
    item.appendChild(right);
    list.appendChild(item);
  });
  box.appendChild(list);
  return box;
}

function renderAdminBelum(){
  const box = el("div");
  const hadir = {};
  state.adminData.hasil.forEach(h=>{ hadir[h.section + "|" + h.identifier] = true; });
  let rows = state.adminData.peserta.filter(p=> !hadir[p.section + "|" + p.nik]);
  const total = state.adminData.peserta.length;
  const filterSec = state.fSection;
  if(filterSec !== "all") rows = rows.filter(p=> p.section === filterSec);

  const stats = el("div", {class:"stat-grid two"});
  [["Belum hadir", rows.length, "var(--bad)"],["Terdaftar", total, "var(--ink)"]].forEach(s=>{
    const c = el("div", {class:"stat"});
    c.appendChild(el("div", {class:"stat-num", text:String(s[1]), style:"color:" + s[2]}));
    c.appendChild(el("div", {class:"stat-label", text:s[0]}));
    stats.appendChild(c);
  });
  box.appendChild(stats);

  const filters = el("div", {class:"filters one"});
  filters.appendChild(selectEl([["all","Semua section"],["scanner","Scanner"],["auditor","Auditor"]], state.fSection === "counter" ? "all" : state.fSection, v=> setState({fSection:v})));
  box.appendChild(filters);

  const copyBtn = el("button", {class:"primary", text:"Salin daftar belum hadir (" + rows.length + ")"});
  copyBtn.addEventListener("click", async ()=>{
    if(!rows.length){ setState({adminMsg:"Semua peserta sudah hadir."}); return; }
    const lines = ["Daftar belum mengerjakan training", ""];
    rows.forEach((p,i)=> lines.push((i+1) + ". " + p.nama + " (" + p.nik + ") - " + SECTION_INFO[p.section].label));
    await copyText(lines.join("\n"));
    setState({adminMsg:"Daftar belum hadir tersalin, tinggal paste ke WhatsApp."});
  });
  box.appendChild(copyBtn);
  if(state.adminMsg) box.appendChild(el("div", {class:"success-text", style:"margin-top:10px;", text:state.adminMsg}));

  const list = el("div", {class:"result-list"});
  if(rows.length === 0) list.appendChild(el("div", {class:"loading", text:"Semua peserta sudah hadir."}));
  rows.forEach(p=>{
    const info = SECTION_INFO[p.section];
    const item = el("div", {class:"result-item", style:"--c:" + info.color});
    const left = el("div", {class:"result-left"});
    left.appendChild(el("div", {class:"result-name", text:p.nama}));
    left.appendChild(el("div", {class:"result-meta", text:p.nik + " \u00b7 " + info.label}));
    item.appendChild(left);
    list.appendChild(item);
  });
  box.appendChild(list);
  return box;
}

function renderAdminKunci(){
  const box = el("div");
  box.appendChild(el("p", {class:"sub", text:"Isi NIK (atau nama untuk Counter), pilih jenis test, lalu buka kunci supaya peserta bisa mengulang."}));

  const secField = el("div", {class:"admin-field"});
  secField.appendChild(el("label", {text:"Section"}));
  secField.appendChild(selectEl([["counter","Counter"],["scanner","Scanner"],["auditor","Auditor"]], state.adminSection, v=>{ state.adminSection = v; }));
  box.appendChild(secField);

  const idField = el("div", {class:"admin-field"});
  idField.appendChild(el("label", {text:"NIK / Nama peserta"}));
  const idInput = el("input", {type:"text", placeholder:"Contoh: 2308171", value: state.adminIdentifier});
  idInput.addEventListener("input", e=>{ state.adminIdentifier = e.target.value; });
  idField.appendChild(idInput);
  box.appendChild(idField);

  const jenisField = el("div", {class:"admin-field"});
  jenisField.appendChild(el("label", {text:"Jenis test"}));
  jenisField.appendChild(selectEl([["pretest","Pre Test"],["posttest","Post Test"]], state.adminJenis, v=>{ state.adminJenis = v; }));
  box.appendChild(jenisField);

  if(state.adminMsg) box.appendChild(el("div", {class: state.adminMsg.startsWith("Berhasil") ? "success-text" : "error", text: state.adminMsg}));

  const btn = el("button", {class:"primary", text: state.adminLoading ? "Memproses..." : "Buka Kunci Ulang", disabled: state.adminLoading});
  btn.addEventListener("click", async ()=>{
    const idVal = idInput.value.trim();
    if(!idVal){ setState({adminMsg:"Isi NIK/nama peserta dulu."}); return; }
    setState({adminLoading:true, adminMsg:""});
    try{
      await sbUpsert("training_test_lock", {
        section: state.adminSection, identifier: idVal, jenis: state.adminJenis,
        selesai: true, boleh_ulang: true
      }, "section,identifier,jenis");
      setState({adminLoading:false, adminMsg:"Berhasil dibuka. Peserta sekarang bisa mengulang " + JENIS_INFO[state.adminJenis].label + "."});
    }catch(err){
      setState({adminLoading:false, adminMsg:"Gagal membuka kunci. Coba lagi."});
    }
  });
  box.appendChild(btn);
  return box;
}


render();
