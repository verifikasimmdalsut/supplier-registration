<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Training Gudang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAFAF8;
    --surface:#FFFFFF;
    --surface-2:#F1F1EC;
    --border:#E3E2DA;
    --ink:#122146;
    --text:#232A3B;
    --text-muted:#6E7488;
    --accent:#F2971D;
    --accent-soft:#FFF1DC;
    --good:#0F7B63;
    --good-soft:#E3F3EE;
    --bad:#C8432F;
    --radius:14px;
    --font-display:"Space Grotesk", -apple-system, sans-serif;
    --font-body:"Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --c-counter:#0F7B63;
    --c-counter-soft:#E3F3EE;
    --c-scanner:#F2971D;
    --c-scanner-soft:#FFF1DC;
    --c-auditor:#122146;
    --c-auditor-soft:#E7EAF2;
  }

  /* ---------- Background per peran ---------- */
  body{ transition:background .3s; }
  body[data-role="counter"]{ background:#D9A400; }
  body[data-role="scanner"]{ background:#2F7D4A; }
  body[data-role="auditor"]{ background:#B3302A; }
  body[data-role] #app > div > h1,
  body[data-role] #app > div > h2,
  body[data-role] #app > div > p.sub,
  body[data-role] #app > div > .loading,
  body[data-role] #app > div > .brand,
  body[data-role] #app > .brand,
  body[data-role] #app > div > .top-nav .back{ color:#fff; }
  body[data-role="counter"] #app > div > h1,
  body[data-role="counter"] #app > div > h2,
  body[data-role="counter"] #app > div > p.sub,
  body[data-role="counter"] #app > div > .loading,
  body[data-role="counter"] #app > div > .top-nav .back{ color:#1d1600; }
  /* ---------- Kupu-kupu ---------- */
  .bf{ position:fixed; width:46px; height:auto; opacity:.7; pointer-events:none; z-index:0; }
  .bf img{ width:100%; display:block; }
  .bf1{ top:8%; left:4%; animation:bf-flutter 7s ease-in-out infinite; }
  .bf2{ top:72%; right:6%; width:36px; animation:bf-flutter 7s ease-in-out 1.5s infinite; }
  .bf3{ top:30%; right:10%; width:28px; animation:bf-loop1 9s ease-in-out infinite; }
  .bf4{ bottom:8%; left:8%; width:24px; animation:bf-loop2 11s ease-in-out 1s infinite; }
  #app{ position:relative; z-index:1; }
  @keyframes bf-flutter{ 0%,100%{transform:translateY(0) rotate(-6deg);} 50%{transform:translateY(-18px) rotate(6deg);} }
  @keyframes bf-loop1{ 0%{transform:translate(0,0) rotate(-10deg);} 25%{transform:translate(-40px,-24px) rotate(12deg);} 50%{transform:translate(-70px,10px) rotate(-8deg);} 75%{transform:translate(-26px,34px) rotate(10deg);} 100%{transform:translate(0,0) rotate(-10deg);} }
  @keyframes bf-loop2{ 0%{transform:translate(0,0) rotate(8deg);} 25%{transform:translate(40px,-30px) rotate(-14deg);} 50%{transform:translate(70px,6px) rotate(12deg);} 75%{transform:translate(24px,30px) rotate(-8deg);} 100%{transform:translate(0,0) rotate(8deg);} }
  @media (prefers-reduced-motion: reduce){ .bf{ animation:none !important; } }
  /* ---------- Kolom wajib isi ---------- */
  .req-label{ display:block; font-weight:800; font-size:14px; color:var(--ink); margin:4px 0 6px; }
  .req-label .star{ color:var(--bad); }
  .so-card input.req{ font-weight:700; border:2px solid var(--ink); }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:var(--font-body);
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  #app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    padding:24px 20px 40px;
    display:flex;
    flex-direction:column;
  }
  .brand{
    font-size:12px;
    letter-spacing:0.03em;
    color:var(--text-muted);
    margin-bottom:10px;
  }
  .barcode{
    display:flex;
    align-items:flex-end;
    gap:2px;
    height:28px;
    margin-bottom:14px;
  }
  .barcode span{ display:block; width:3px; background:var(--ink); border-radius:1px; }
  h1{ font-family:var(--font-display); color:var(--ink); font-size:25px; font-weight:600; margin:0 0 22px; line-height:1.3; }
  h2{ font-family:var(--font-display); color:var(--ink); font-size:19px; font-weight:600; margin:0 0 6px; }
  p.sub{ color:var(--text-muted); font-size:14px; margin:0 0 20px; line-height:1.5; }

  .section-grid{ display:flex; flex-direction:column; gap:12px; }
  .section-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-left:4px solid var(--c);
    border-radius:10px;
    padding:18px 20px;
    text-align:left;
    color:var(--text);
    cursor:pointer;
    font-family:inherit;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .section-card:active{ transform:scale(0.98); }
  .section-card .label{ font-family:var(--font-display); font-size:17px; font-weight:600; color:var(--ink); }
  .section-card .desc{ font-size:13px; color:var(--text-muted); margin-top:2px; }
  .chev{ color:var(--text-muted); font-size:20px; }

  input[type=text]{
    width:100%;
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--text);
    padding:14px 16px;
    border-radius:10px;
    font-size:16px;
    margin-bottom:12px;
  }
  input[type=text]:focus{ outline:none; border-color:var(--accent); }

  select{
    width:100%;
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--text);
    padding:14px 16px;
    border-radius:10px;
    font-size:16px;
    margin-bottom:12px;
  }

  button.primary{
    width:100%;
    background:var(--accent);
    color:#2B1900;
    border:none;
    padding:15px 16px;
    border-radius:10px;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    margin-top:4px;
  }
  button.primary:active{ transform:scale(0.98); }
  button.primary:disabled{ opacity:0.45; cursor:default; }
  button.ghost{
    width:100%;
    background:transparent;
    color:var(--text-muted);
    border:1px solid var(--border);
    padding:13px 16px;
    border-radius:10px;
    font-size:14px;
    cursor:pointer;
    margin-top:10px;
  }
  button.link{
    background:none;
    border:none;
    color:var(--text-muted);
    font-size:13px;
    text-decoration:underline;
    cursor:pointer;
    padding:0;
    margin-top:auto;
    align-self:center;
  }

  .error{ color:var(--bad); font-size:13px; margin:-6px 0 12px; }
  .success-text{ color:var(--good); font-size:13px; margin:-6px 0 12px; }

  .top-nav{ display:flex; align-items:center; gap:10px; margin-bottom:20px; }
  .back{ background:none; border:none; color:var(--text-muted); font-size:22px; cursor:pointer; padding:0; line-height:1; }

  .tag{
    display:inline-block;
    font-family:var(--font-display);
    font-size:12px;
    font-weight:600;
    padding:5px 12px;
    border-radius:20px;
    margin-bottom:14px;
  }

  .materi-box{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:20px;
    font-size:15px;
    line-height:1.7;
        margin-bottom:20px;
    flex:1;
  }


  .pdf-btn{
    display:block; text-align:center; text-decoration:none;
    background:var(--ink); color:#fff; font-weight:600; font-size:15px;
    padding:14px 16px; border-radius:10px; margin:6px 0 16px;
  }
  .materi-h{ font-family:var(--font-display); font-size:16px; font-weight:600; color:var(--ink); margin:22px 0 8px; }
  .materi-h:first-child{ margin-top:0; }
  .materi-p{ margin:0 0 8px; line-height:1.65; }
  .materi-ul{ margin:0 0 8px; padding-left:20px; }
  .materi-ul li{ margin-bottom:6px; line-height:1.6; }
  .menu-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-left:4px solid var(--c, var(--border));
    border-radius:10px;
    padding:16px 18px;
    margin-bottom:12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  .menu-card.disabled{ opacity:0.5; }
  .menu-left{ display:flex; flex-direction:column; }
  .menu-title{ font-family:var(--font-display); font-size:16px; font-weight:600; color:var(--ink); }
  .menu-desc{ font-size:12px; color:var(--text-muted); margin-top:3px; }
  .menu-btn{
    background:var(--accent);
    color:#2B1900;
    border:none;
    padding:9px 16px;
    border-radius:8px;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    white-space:nowrap;
    font-family:var(--font-body);
  }
  .menu-btn:disabled{ background:var(--surface-2); color:var(--text-muted); cursor:default; }
  .menu-btn.done{ background:var(--good-soft); color:var(--good); }
  .badge-score{
    font-family:var(--font-display);
    font-size:13px;
    font-weight:600;
    color:var(--good);
    background:var(--good-soft);
    padding:5px 12px;
    border-radius:20px;
  }

  .soal-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:18px;
    margin-bottom:14px;
  }
  .soal-num{ font-size:13px; color:var(--text-muted); margin-bottom:6px; }
  .soal-img{ display:block; width:100%; max-width:420px; height:auto; border-radius:10px; border:1px solid var(--border); margin:0 auto 14px; }
  .soal-teks{ font-size:16px; font-weight:600; margin-bottom:14px; line-height:1.4; }
  .pilihan{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:12px 14px;
    border:1px solid var(--border);
    border-radius:10px;
    margin-bottom:8px;
    cursor:pointer;
    background:var(--surface);
  }
  .pilihan.selected{ border-color:var(--accent); background:var(--accent-soft); }
  .pilihan .huruf{
    width:22px; height:22px; border-radius:50%;
    border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:700; color:var(--text-muted);
    flex-shrink:0; background:var(--surface);
  }
  .pilihan.selected .huruf{ background:var(--accent); border-color:var(--accent); color:#2B1900; }
  .pilihan .teks{ font-size:14px; line-height:1.5; }

  .center-flex{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
  .score-circle{
    width:164px; height:164px; border-radius:50%;
    border:2px dashed var(--accent);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    margin-bottom:20px; background:var(--accent-soft);
    position:relative;
  }
  .score-circle::before{
    content:"";
    position:absolute; inset:10px;
    border-radius:50%;
    background:var(--surface);
    border:1px solid var(--border);
  }
  .score-num{ font-family:var(--font-display); font-size:42px; font-weight:600; color:var(--ink); position:relative; }
  .score-label{ font-size:11px; letter-spacing:0.04em; color:var(--text-muted); margin-top:2px; position:relative; }

  .loading{ text-align:center; color:var(--text-muted); padding:40px 0; font-size:14px; }

  .progress-bar{ height:4px; background:var(--surface-2); border-radius:2px; margin-bottom:20px; overflow:hidden; }
  .progress-fill{ height:100%; background:var(--accent); transition:width .2s ease; }


  .barcode.small{ height:18px; margin-bottom:10px; }
  .tabs{ display:flex; gap:6px; margin:14px 0 18px; border-bottom:1px solid var(--border); }
  .tab{
    background:none; border:none; padding:10px 12px; font-family:var(--font-display);
    font-size:14px; font-weight:600; color:var(--text-muted); cursor:pointer;
    border-bottom:3px solid transparent; margin-bottom:-1px;
  }
  .tab.active{ color:var(--ink); border-bottom-color:var(--accent); }
  .stat-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:16px; }
  .stat-grid.two{ grid-template-columns:repeat(2,1fr); }
  .stat{ background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px 12px; }
  .stat-num{ font-family:var(--font-display); font-size:28px; font-weight:600; line-height:1; }
  .stat-label{ font-size:12px; color:var(--text-muted); margin-top:6px; }
  .filters{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:12px; }
  .filters.one{ grid-template-columns:1fr; }
  .filters select{ margin-bottom:0; padding:11px 10px; font-size:14px; }
  .result-list{ margin-top:16px; }
  .result-item{
    background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--c, var(--border));
    border-radius:10px; padding:12px 14px; margin-bottom:8px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .result-name{ font-family:var(--font-display); font-size:15px; font-weight:600; color:var(--ink); }
  .result-meta{ font-size:12px; color:var(--text-muted); margin-top:3px; }
  .result-right{ display:flex; align-items:center; gap:8px; flex-shrink:0; }
  .nilai-badge{ font-family:var(--font-display); font-weight:600; font-size:15px; min-width:44px; text-align:center; padding:6px 10px; border-radius:8px; }
  .nilai-badge.pass{ background:var(--good-soft); color:var(--good); }
  .nilai-badge.fail{ background:#FBE7E3; color:var(--bad); }
  .mini-btn{ background:var(--surface); border:1px solid var(--border); color:var(--ink); font-size:12px; font-weight:600; padding:7px 10px; border-radius:8px; cursor:pointer; font-family:var(--font-body); }
  .menu-btn.wait{ background:var(--surface-2); color:var(--text-muted); }
  a.menu-btn{ text-decoration:none; display:inline-block; }
  .so-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:12px; }
  .so-card h3{ margin:0 0 6px; font-family:var(--font-display); color:var(--ink); font-size:17px; }
  .chip{ display:inline-block; padding:3px 10px; border-radius:99px; font-size:12px; font-weight:600; background:var(--accent-soft); color:#8A5200; margin-right:6px; }
  .chip.good{ background:var(--good-soft); color:var(--good); }
  .chip.muted{ background:var(--surface-2); color:var(--text-muted); }
  .date-chips{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:4px; }
  .date-chip{ border:1px solid var(--border); background:var(--surface); color:var(--ink); border-radius:999px; padding:6px 12px; font-size:13px; cursor:pointer; }
  .date-chip.on{ background:var(--ink); color:#fff; border-color:var(--ink); }
  .thumbs{ display:flex; flex-wrap:wrap; gap:8px; margin:8px 0; }
  .thumb{ position:relative; width:84px; height:84px; border-radius:8px; overflow:hidden; border:1px solid var(--border); }
  .thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .thumb button{ position:absolute; top:2px; right:2px; width:22px; height:22px; padding:0; border-radius:50%; font-size:12px; line-height:1; background:rgba(0,0,0,.6); color:#fff; border:0; }
  .gond{ border-top:1px dashed var(--border); padding:8px 0; font-size:13px; }
  .gond b{ font-family:var(--font-display); color:var(--ink); font-size:15px; }
  .so-card input[type=text]{ margin-bottom:8px; }
  .menu-btn.ask{ background:var(--ink); color:#fff; }
  .badge-wait{ font-family:var(--font-display); font-size:12px; font-weight:600; color:#8a5a00; background:var(--accent-soft); padding:5px 12px; border-radius:20px; white-space:nowrap; }
  .gel-chip{ display:inline-block; font-size:12px; font-weight:600; color:var(--text-muted); background:var(--surface-2); padding:3px 10px; border-radius:20px; margin-left:6px; vertical-align:middle; }
  .ap-actions{ display:flex; gap:6px; }
  .mini-btn.ok{ background:var(--good-soft); color:var(--good); border-color:transparent; }
  .mini-btn.no{ background:#FBE7E3; color:var(--bad); border-color:transparent; }
  .row-gap{ display:flex; gap:8px; align-items:center; margin-bottom:12px; }
  .row-gap select{ margin-bottom:0; }
  .row-gap button{ width:auto; margin:0; white-space:nowrap; padding:12px 16px; }
  .admin-field label{ font-size:13px; font-weight:600; color:var(--text-muted); display:block; margin-bottom:6px; }
</style>
</head>

async function sb(path){
  const res = await fetch(SUPABASE_URL + "/rest/v1/" + path, {
    headers:{ "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY }
  });
  if(!res.ok) throw new Error("Gagal ambil data");
  return res.json();
}
async function sbAll(path){
  const out = [];
  for(let off=0; ; off+=1000){
    const rows = await sb(path + "&limit=1000&offset=" + off);
    out.push(...rows);
    if(rows.length < 1000) break;
  }
  return out;
}
async function sbInsert(table, body){
  const res = await fetch(SUPABASE_URL + "/rest/v1/" + table, {
    method:"POST",
    headers:{ "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY, "Content-Type":"application/json", "Prefer":"return=minimal" },
    body: JSON.stringify(body)
  });
  if(!res.ok) throw new Error("Gagal simpan data");
}
async function sbUpsert(table, body, conflictCols){
  const res = await fetch(SUPABASE_URL + "/rest/v1/" + table + "?on_conflict=" + conflictCols, {
    method:"POST",
    headers:{ "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY, "Content-Type":"application/json", "Prefer":"resolution=merge-duplicates,return=minimal" },
    body: JSON.stringify(body)
  });
  if(!res.ok) throw new Error("Gagal update data");
}

async function sbPatch(path, body){
  const res = await fetch(SUPABASE_URL + "/rest/v1/" + path, {
    method:"PATCH",
    headers:{ "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY, "Content-Type":"application/json", "Prefer":"return=minimal" },
    body: JSON.stringify(body)
  });
  if(!res.ok) throw new Error("Gagal update data");
}

const LOGIN_KEY = "training_login_v1";
function persistLogin(){
  try{
    if(state.screen === "home"){ localStorage.removeItem(LOGIN_KEY); return; }
    if(state.section && state.identifier && state.screen !== "admin"){
      localStorage.setItem(LOGIN_KEY, JSON.stringify({t:Date.now(), section:state.section, nama:state.nama, nik:state.nik, identifier:state.identifier, brand:state.brand, departemen:state.departemen}));
    }
  }catch(e){}
}
function restoreLogin(){
  try{
    const raw = localStorage.getItem(LOGIN_KEY);
    if(!raw) return;
    const d = JSON.parse(raw);
    if(!d || !d.section || !d.identifier || Date.now() - d.t > 12 * 3600 * 1000){ localStorage.removeItem(LOGIN_KEY); return; }
    state = Object.assign({}, state, {section:d.section, nama:d.nama, nik:d.nik, identifier:d.identifier, brand:d.brand || "", departemen:d.departemen || "", screen:"menu"});
  }catch(e){}
}
function setState(patch){ state = Object.assign({}, state, patch); persistLogin(); render(); }

function render(){
  try{ if(state.section && state.screen !== "home" && state.screen !== "admin") document.body.setAttribute("data-role", state.section); else document.body.removeAttribute("data-role"); }catch(e){}
  const app = document.getElementById("app");
  app.innerHTML = "";
  app.style.maxWidth = (state.screen === "admin" && state.adminAuthed) ? "760px" : "480px";
  if(state.screen === "home") app.appendChild(renderHome());
  else if(state.screen === "login") app.appendChild(renderLogin());
  else if(state.screen === "menu") app.appendChild(renderMenu());
  else if(state.screen === "so") app.appendChild(renderSO());
  else if(state.screen === "layout") app.appendChild(renderLayout());
  else if(state.screen === "dashboard") app.appendChild(renderDashboard());
  else if(state.screen === "materi") app.appendChild(renderMateri());
  else if(state.screen === "kuis") app.appendChild(renderKuis());
  else if(state.screen === "hasil") app.appendChild(renderHasil());
  else if(state.screen === "admin") app.appendChild(renderAdmin());
}

function el(tag, props, children){
  const e = document.createElement(tag);
  if(props) for(const k in props){
    if(k === "class") e.className = props[k];
    else if(k === "text") e.textContent = props[k];
    else if(k.startsWith("on")) e.addEventListener(k.slice(2).toLowerCase(), props[k]);
    else if(props[k] === null || props[k] === undefined || props[k] === false) e.removeAttribute(k);
    else e.setAttribute(k, props[k]);
  }
  if(children) children.forEach(c => c && e.appendChild(c));
  return e;
}

function tagEl(text, info){
  return el("div", {class:"tag", text:text, style:"background:" + info.soft + ";color:" + info.color + ";"});

function barcodeEl(){
  const bar = el("div", {class:"barcode"});
  const widths = [2,1,3,1,2,4,1,2,1,3,2,1,4,1,2,3,1,2];
  widths.forEach((w,i)=>{
    const h = 14 + ((i*7) % 14);
    bar.appendChild(el("span", {style:"width:" + w + "px;height:" + h + "px;"}));
  });
  return bar;
}

    wrap.appendChild(nikInput);
    brandInput = el("input", { type:"text", placeholder:"Brand", value: state.inputBrand });
    brandInput.addEventListener("input", e => { state.inputBrand = e.target.value; });

  btn.addEventListener("click", async ()=>{
    const val = input.value.trim();
    if(!val){ setState({errorMsg: counterMode ? "Nama belum diisi." : "NIK belum diisi."}); return; }
    if(counterMode){
      const nk = nikInput.value.trim().replace(/\s+/g, "");
      const br = brandInput.value.trim(), dp = deptInput.value.trim();
      if(!nk){ setState({errorMsg:"NIK belum diisi."}); return; }
      if(!br){ setState({errorMsg:"Brand belum diisi."}); return; }
      if(!dp){ setState({errorMsg:"Departemen belum diisi."}); return; }

      fetchLayoutUrl();

async function fetchApprovals(){
  const g = state.gelombang;
  const rows = await sb("training_approval?section=eq." + state.section + "&identifier=eq." + encodeURIComponent(state.identifier) + "&gelombang=eq." + g + "&select=jenis,status");
  const ap = { pretest:null, posttest:null };
  rows.forEach(r=>{ ap[r.jenis] = r.status; });
  return ap;
}

async function fetchGelombang(){ return 1; }

async function loadDashboard(){
  setState({loading:true, screen:"dashboard"});
  try{
    const gelombang = await fetchGelombang();
    state.gelombang = gelombang;
    const progRows = await sb("training_progress?section=eq." + state.section + "&identifier=eq." + encodeURIComponent(state.identifier) + "&select=sudah_baca_materi");
    const lockRows = await sb("training_test_lock?section=eq." + state.section + "&identifier=eq." + encodeURIComponent(state.identifier) + "&select=jenis,selesai,boleh_ulang");
    const hasilRows = await sb("training_hasil?section=eq." + state.section + "&identifier=eq." + encodeURIComponent(state.identifier) + "&gelombang=eq." + gelombang + "&select=jenis,nilai,selesai_at&order=selesai_at.desc");
    const approvals = await fetchApprovals();

    const locks = { pretest:{selesai:false, boleh_ulang:false, nilai:null}, posttest:{selesai:false, boleh_ulang:false, nilai:null} };
    lockRows.forEach(r=>{ locks[r.jenis].selesai = r.selesai; locks[r.jenis].boleh_ulang = r.boleh_ulang; });
    ["pretest","posttest"].forEach(j=>{
      const found = hasilRows.find(h => h.jenis === j);
      if(found) locks[j].nilai = found.nilai;
    });

    setState({
      loading:false,
      gelombang,
      approvals,
      progress: { sudah_baca_materi: progRows.length ? progRows[0].sudah_baca_materi : false },
      locks
    });
  }catch(err){
    setState({loading:false});
  }
}

// cek status persetujuan diam-diam (tanpa layar "memuat") selama peserta menunggu
async function refreshApprovalsQuiet(){
  if(state.screen !== "dashboard" || state.loading) return;
  if(state.approvals.pretest !== "menunggu" && state.approvals.posttest !== "menunggu") return;
  try{
    const approvals = await fetchApprovals();
    if(state.screen === "dashboard" && (approvals.pretest !== state.approvals.pretest || approvals.posttest !== state.approvals.posttest)){
      setState({approvals});
    }
  }catch(e){ /* abaikan, coba lagi di putaran berikutnya */ }
}
setInterval(refreshApprovalsQuiet, 8000);

async function requestTest(jenis){
  setState({loading:true});
  const body = {
    section: state.section, identifier: state.identifier, nama: state.nama,
    brand: state.brand || null, departemen: state.departemen || null,
    jenis: jenis, gelombang: state.gelombang, status: "menunggu"
  };
  try{
    try{
      await sbInsert("training_approval", body);
    }catch(e){
      // sudah ada barisnya (mis. pernah ditolak): ajukan ulang, tapi jangan menimpa yang sudah disetujui
      await sbPatch("training_approval?section=eq." + state.section + "&identifier=eq." + encodeURIComponent(state.identifier) + "&jenis=eq." + jenis + "&gelombang=eq." + state.gelombang + "&status=eq.ditolak",
        { status:"menunggu", requested_at: new Date().toISOString(), decided_at: null });
    }
  }catch(err){ /* status dibaca ulang di bawah */ }
  await loadDashboard();
}

async function startTest(jenis){
  const lock = state.locks[jenis];
  const retake = lock.selesai && lock.boleh_ulang;
  if(!retake){
    setState({loading:true});
    let st = null;
    try{ st = (await fetchApprovals())[jenis]; }catch(e){}
    if(st !== "disetujui"){ await loadDashboard(); return; }
    setState({loading:false});
  }
  setState({currentJenis: jenis});
  loadKuis();
}

function renderDashboard(){
  const info = SECTION_INFO[state.section];
  const wrap = el("div");
  const nav = el("div", {class:"top-nav"});
  nav.appendChild(el("button", {class:"back", text:"\u2190", onClick:()=> setState({screen:"menu"})}));
  wrap.appendChild(nav);
  wrap.appendChild(tagEl(info.label + " \u00b7 " + state.nama, info));
  wrap.appendChild(el("h2", {text:"Menu training"}));

  if(state.loading){
    wrap.appendChild(el("div", {class:"loading", text:"Memuat status..."}));
    return wrap;
  }

  wrap.appendChild(el("p", {class:"sub", text:"Materi bisa dibaca kapan saja. Pre Test dan Post Test perlu persetujuan admin dulu. Post Test baru bisa diajukan setelah Pre Test selesai."}));

  // Materi card
  const materiCard = el("div", {class:"menu-card", style:"--c:" + info.color});
  const materiLeft = el("div", {class:"menu-left"});
  materiLeft.appendChild(el("div", {class:"menu-title", text:"Materi"}));
  materiLeft.appendChild(el("div", {class:"menu-desc", text: state.progress.sudah_baca_materi ? "Sudah dibaca" : "Belum dibaca"}));
  materiCard.appendChild(materiLeft);
  const materiBtn = el("button", {class:"menu-btn" + (state.progress.sudah_baca_materi ? " done" : ""), text: state.progress.sudah_baca_materi ? "Baca lagi" : "Buka"});
  materiBtn.addEventListener("click", ()=>{ setState({screen:"materi"}); loadMateri(); });
  materiCard.appendChild(materiBtn);
  wrap.appendChild(materiCard);

  // Pretest & Posttest cards (butuh persetujuan admin)
  const pretestDone = state.approvals.pretest === "dipakai" && !state.locks.pretest.boleh_ulang;
  wrap.appendChild(el("div", {class:"sub", style:"margin:-8px 0 14px;", text:"Remedial: minta ulang jika nilai < " + PASS_GRADE}));
  ["pretest","posttest"].forEach(jenis=>{
    const jinfo = JENIS_INFO[jenis];
    const lock = state.locks[jenis];
    const ap = state.approvals[jenis];
    const retake = lock.selesai && lock.boleh_ulang;
    const done = ap === "dipakai" && !retake;
    const gatedByPretest = jenis === "posttest" && !pretestDone && !done && !retake;
    const card = el("div", {class:"menu-card" + (gatedByPretest ? " disabled" : ""), style:"--c:" + info.color});
    const left = el("div", {class:"menu-left"});
    left.appendChild(el("div", {class:"menu-title", text: jinfo.label}));
    let desc = "Perlu persetujuan admin sebelum mulai";
    if(retake) desc = "Sudah dibuka admin untuk mengulang";
    else if(done) desc = "Sudah dikerjakan, hubungi admin untuk mengulang";
    else if(gatedByPretest) desc = "Selesaikan Pre Test dulu";
    else if(ap === "disetujui") desc = "Disetujui admin, silakan mulai";
    else if(ap === "menunggu") desc = "Menunggu persetujuan admin (halaman ini memeriksa otomatis)";
    else if(ap === "ditolak") desc = "Permintaan ditolak admin. Hubungi admin atau ajukan lagi";
    left.appendChild(el("div", {class:"menu-desc", text: desc}));
    card.appendChild(left);

    if(done){
      card.appendChild(el("div", {class:"badge-score", text:"Nilai " + (lock.nilai != null ? lock.nilai : "-")}));
    } else if(retake){
      const btn = el("button", {class:"menu-btn", text:"Ulang"});
      btn.addEventListener("click", ()=>{ if(confirm("Mulai " + JENIS_INFO[jenis].label + " sekarang? Jawaban yang sudah dikirim tidak bisa diubah.")) startTest(jenis); });
      card.appendChild(btn);
    } else if(gatedByPretest){
      card.appendChild(el("button", {class:"menu-btn", text:"Ajukan", disabled:true}));
    } else if(ap === "disetujui"){
      const btn = el("button", {class:"menu-btn", text:"Mulai"});
      btn.addEventListener("click", ()=>{ if(confirm("Mulai " + JENIS_INFO[jenis].label + " sekarang? Jawaban yang sudah dikirim tidak bisa diubah.")) startTest(jenis); });
      card.appendChild(btn);
    } else if(ap === "menunggu"){
      card.appendChild(el("div", {class:"badge-wait", text:"Menunggu admin"}));
    } else {
      const btn = el("button", {class:"menu-btn ask", text: ap === "ditolak" ? "Ajukan lagi" : "Ajukan"});
      btn.addEventListener("click", ()=>{ if(confirm("Ajukan " + JENIS_INFO[jenis].label + " ke admin?")) requestTest(jenis); });
      card.appendChild(btn);
    }
    wrap.appendChild(card);
  });

  return wrap;
}

function renderKonten(konten){
  const box = el("div", {class:"materi-box"});
  let ul = null;
  String(konten || "").split("\n").forEach(raw=>{
    const line = raw.trim();
    if(!line){ ul = null; return; }
    if(line.startsWith("## ")){
      ul = null;
      box.appendChild(el("h3", {class:"materi-h", text: line.slice(3)}));
    } else if(line.startsWith("- ")){
      if(!ul){ ul = el("ul", {class:"materi-ul"}); box.appendChild(ul); }
      ul.appendChild(el("li", {text: line.slice(2)}));
    } else {
      ul = null;
      box.appendChild(el("p", {class:"materi-p", text: line}));
    }
  });
  return box;
}

function renderKuis(){
  const info = SECTION_INFO[state.section];
  const jinfo = JENIS_INFO[state.currentJenis];
  const wrap = el("div");
  wrap.appendChild(tagEl(info.label + " \u00b7 " + jinfo.label, info));

  if(state.loading){
    wrap.appendChild(el("div", {class:"loading", text:"Memuat soal..."}));
    return wrap;
  }
  if(state.soalList.length === 0){
    wrap.appendChild(el("h2", {text:"Soal belum tersedia"}));
    wrap.appendChild(el("p", {class:"sub", text:"Admin belum menambahkan soal untuk bagian ini."}));
    wrap.appendChild(el("button", {class:"ghost", text:"Kembali ke menu", onClick:()=> setState({screen:"dashboard"})}));
    return wrap;
  }

  const answered = Object.keys(state.jawaban).length;
  const total = state.soalList.length;
  wrap.appendChild(el("h2", {text: jinfo.label + " " + info.label}));
  wrap.appendChild(el("p", {class:"sub", text: answered + " dari " + total + " soal terjawab \u00b7 hanya bisa dikerjakan sekali"}));
  const bar = el("div", {class:"progress-bar"});
  bar.appendChild(el("div", {class:"progress-fill", style:"width:" + Math.round(answered/total*100) + "%"}));
  wrap.appendChild(bar);

  state.soalList.forEach((soal, idx)=>{
    const card = el("div", {class:"soal-card"});
    card.appendChild(el("div", {class:"soal-num", text:"Soal " + (idx+1) + " dari " + total}));
    card.appendChild(el("div", {class:"soal-teks", text: soal.pertanyaan}));
    if(soal.gambar && SOAL_GAMBAR[soal.gambar]){
      card.appendChild(el("img", {class:"soal-img", src:SOAL_GAMBAR[soal.gambar], alt:"Gambar soal"}));
    }
    ["a","b","c","d"].forEach(letter=>{
      const teks = soal["pilihan_" + letter];
      if(!teks) return;
      const isSel = state.jawaban[soal.id] === letter.toUpperCase();
      const opt = el("div", {class:"pilihan" + (isSel ? " selected" : "")});
      opt.appendChild(el("div", {class:"huruf", text: letter.toUpperCase()}));
      opt.appendChild(el("div", {class:"teks", text: teks}));
      opt.addEventListener("click", ()=>{ state.jawaban[soal.id] = letter.toUpperCase(); render(); });
      card.appendChild(opt);
    });
    wrap.appendChild(card);
  });

  if(state.errorMsg) wrap.appendChild(el("div", {class:"error", text: state.errorMsg}));

  const btn = el("button", {class:"primary", text: state.loading ? "Menyimpan..." : "Selesai, kirim jawaban"});
  btn.addEventListener("click", submitKuis);
  wrap.appendChild(btn);
  return wrap;
}

async function submitKuis(){
  const total = state.soalList.length;
  const answered = Object.keys(state.jawaban).length;
  if(answered < total){
    setState({errorMsg:"Masih ada " + (total - answered) + " soal yang belum dijawab."});
    return;
  }
  let benar = 0;
  state.soalList.forEach(soal=>{ if(state.jawaban[soal.id] === soal.jawaban_benar) benar++; });
  const nilai = Math.round((benar/total)*100);
  setState({loading:true, errorMsg:""});
  try{
    await sbInsert("training_hasil", {
      section: state.section, nama: state.nama, nik: state.nik || null, identifier: state.identifier,
      jenis: state.currentJenis, benar: benar, total: total, nilai: nilai,
      brand: state.brand || null, departemen: state.departemen || null,
      gelombang: state.gelombang
    });
    await sbUpsert("training_test_lock", {
      section: state.section, identifier: state.identifier, jenis: state.currentJenis,
      selesai: true, boleh_ulang: false
    }, "section,identifier,jenis");
  }catch(err){ /* tetap tampilkan nilai walau gagal simpan */ }
  try{
    const stamp = new Date().toISOString();
    await sbInsert("training_jawaban", state.soalList.map((soal, idx)=>({
      section: state.section, identifier: state.identifier, jenis: state.currentJenis, gelombang: state.gelombang,
      soal_id: soal.id, urutan: idx + 1, pertanyaan: soal.pertanyaan,
      pilihan: { a: soal.pilihan_a, b: soal.pilihan_b, c: soal.pilihan_c, d: soal.pilihan_d },
      jawaban: state.jawaban[soal.id], jawaban_benar: soal.jawaban_benar,
      benar: state.jawaban[soal.id] === soal.jawaban_benar, selesai_at: stamp
    })));
  }catch(err){ /* rincian jawaban gagal tersimpan, nilai tetap aman */ }
  try{
    await sbPatch("training_approval?section=eq." + state.section + "&identifier=eq." + encodeURIComponent(state.identifier) + "&jenis=eq." + state.currentJenis + "&gelombang=eq." + state.gelombang, { status:"dipakai" });
  }catch(err){ /* abaikan */ }
  const locks = Object.assign({}, state.locks);
  const approvals = Object.assign({}, state.approvals);
  approvals[state.currentJenis] = "dipakai";
  locks[state.currentJenis] = { selesai:true, boleh_ulang:false, nilai:nilai };
  setState({loading:false, screen:"hasil", hasil:{benar, total, nilai}, locks, approvals});
}

function tglKey(iso){
  try{ return new Date(iso).toLocaleDateString("en-CA", {timeZone:"Asia/Jakarta"}); }catch(e){ return String(iso).slice(0,10); }
}
function tglLabel(key){
  return new Date(key + "T00:00:00").toLocaleDateString("id-ID", {day:"numeric", month:"long", year:"numeric"});
}
function tglMatch(iso){
  const keys = Object.keys(state.fTglSet || {});
  return keys.length === 0 || !!state.fTglSet[tglKey(iso)];
}
function tglShort(key){
  return new Date(key + "T00:00:00").toLocaleDateString("id-ID", {day:"numeric", month:"short"});
}
function hasilFiltered(){
  return state.adminData.hasil.filter(h => tglMatch(h.selesai_at));
}
function gelLabel(){
  const keys = Object.keys(state.fTglSet || {}).sort();
  return keys.length === 0 ? "Semua tanggal" : "Tanggal " + keys.map(tglShort).join(" + ");
}
function gelSelect(){
  const set = {};
  state.adminData.hasil.forEach(h=>{ set[tglKey(h.selesai_at)] = true; });
  (state.adminData.approvals || []).forEach(a=>{ set[tglKey(a.requested_at)] = true; });
  const wrap = el("div", {class:"date-chips", style:"grid-column:1 / -1;"});
  const all = el("button", {class:"date-chip" + (Object.keys(state.fTglSet || {}).length === 0 ? " on" : ""), text:"Semua tanggal"});
  all.addEventListener("click", ()=> setState({fTglSet:{}}));
  wrap.appendChild(all);
  Object.keys(set).sort().reverse().forEach(k=>{
    const on = !!(state.fTglSet && state.fTglSet[k]);
    const b = el("button", {class:"date-chip" + (on ? " on" : ""), text:tglShort(k)});
    b.addEventListener("click", ()=>{
      const next = Object.assign({}, state.fTglSet);
      if(on) delete next[k]; else next[k] = true;
      setState({fTglSet:next});
    });
    wrap.appendChild(b);
  });
  return wrap;
}

function latestResults(){
  // ambil percobaan terbaru per (section, identifier, jenis, gelombang)
  const seen = {};
  const out = [];
  hasilFiltered().forEach(h=>{
    const k = h.section + "|" + h.identifier + "|" + h.jenis + "|" + h.gelombang;
    if(!seen[k]){ seen[k] = true; out.push(h); }
  });
  return out;
}

function fmtTanggal(iso){
  const d = new Date(iso);
  return d.toLocaleDateString("id-ID", {day:"2-digit", month:"short"}) + " " +
         d.toLocaleTimeString("id-ID", {hour:"2-digit", minute:"2-digit"});
}

function copyText(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    return navigator.clipboard.writeText(text);
  }
  const ta = document.createElement("textarea");
  ta.value = text; document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); }catch(e){}
  document.body.removeChild(ta);
  return Promise.resolve();
}

function selectEl(options, current, onChange){
  const s = el("select");
  options.forEach(o=>{
    const opt = el("option", {value:o[0], text:o[1]});
    if(current === o[0]) opt.setAttribute("selected","true");
    s.appendChild(opt);
  });
  s.addEventListener("change", e=> onChange(e.target.value));
  return s;
}

    (!q || a.nama.toLowerCase().includes(q) || String(a.identifier).toLowerCase().includes(q))
  );

  if(state.adminMsg) box.appendChild(el("div", {class: state.adminMsg.startsWith("Berhasil") ? "success-text" : "error", text: state.adminMsg}));

  const waiting = rows.filter(a=> a.status === "menunggu");
  const bulk = el("button", {class:"primary", text: state.adminLoading ? "Memproses..." : "Setujui semua yang menunggu (" + waiting.length + ")", disabled: state.adminLoading || waiting.length === 0});
  bulk.addEventListener("click", ()=>{
    if(confirm("Setujui " + waiting.length + " permintaan sesuai filter saat ini?")) decideApproval(waiting.map(a=> a.id), "disetujui");
  });
  box.appendChild(bulk);

  const refresh = el("button", {class:"ghost", text:"Muat ulang (otomatis tiap 15 detik)"});
  refresh.addEventListener("click", ()=> loadAdminData());
  box.appendChild(refresh);

  const list = el("div", {class:"result-list"});
  if(rows.length === 0) list.appendChild(el("div", {class:"loading", text:"Tidak ada permintaan untuk filter ini."}));
  rows.forEach(a=>{
    const info = SECTION_INFO[a.section];
    const item = el("div", {class:"result-item", style:"--c:" + info.color});
    const left = el("div", {class:"result-left"});
    left.appendChild(el("div", {class:"result-name", text:a.nama}));
    const who = a.section === "counter" && (a.brand || a.departemen) ? (a.brand || "-") + " / " + (a.departemen || "-") : a.identifier;
    left.appendChild(el("div", {class:"result-meta", text: who + " \u00b7 " + info.label + " \u00b7 " + JENIS_INFO[a.jenis].label + " \u00b7 " + fmtTanggal(a.requested_at)}));
    item.appendChild(left);
    const right = el("div", {class:"result-right"});
    if(a.status === "menunggu" || a.status === "ditolak"){
      const acts = el("div", {class:"ap-actions"});
      const ok = el("button", {class:"mini-btn ok", text:"Setujui", disabled: state.adminLoading});
      ok.addEventListener("click", ()=> decideApproval([a.id], "disetujui"));
      acts.appendChild(ok);
      if(a.status === "menunggu"){
        const no = el("button", {class:"mini-btn no", text:"Tolak", disabled: state.adminLoading});
        no.addEventListener("click", ()=> decideApproval([a.id], "ditolak"));
        acts.appendChild(no);
      } else {
        acts.appendChild(el("span", {class:"badge-wait", text:"Ditolak"}));
      }
      right.appendChild(acts);
    } else if(a.status === "disetujui"){
      right.appendChild(el("span", {class:"badge-score", text:"Disetujui"}));
      const no = el("button", {class:"mini-btn no", text:"Batalkan", disabled: state.adminLoading});
      no.addEventListener("click", ()=> decideApproval([a.id], "ditolak"));
      right.appendChild(no);
    } else {
      right.appendChild(el("span", {class:"badge-score", text:"Selesai"}));
    }
    item.appendChild(right);
    list.appendChild(item);
  });
  box.appendChild(list);
  return box;
}

function renderAdminBelum(){
  const box = el("div");
  const hadir = {};
  hasilFiltered().forEach(h=>{ hadir[h.section + "|" + h.identifier] = true; });
  let rows = state.adminData.peserta.filter(p=> !hadir[p.section + "|" + p.nik]);
  const total = state.adminData.peserta.length;
  const filterSec = state.fSection;
  if(filterSec !== "all") rows = rows.filter(p=> p.section === filterSec);

  const stats = el("div", {class:"stat-grid two"});
  [["Belum hadir", rows.length, "var(--bad)"],["Terdaftar", total, "var(--ink)"]].forEach(s=>{
    const c = el("div", {class:"stat"});
    c.appendChild(el("div", {class:"stat-num", text:String(s[1]), style:"color:" + s[2]}));
    c.appendChild(el("div", {class:"stat-label", text:s[0]}));
    stats.appendChild(c);
  });
  box.appendChild(stats);

  const filters = el("div", {class:"filters one"});
  filters.appendChild(gelSelect());
  filters.appendChild(selectEl([["all","Semua section"],["scanner","Scanner"],["auditor","Auditor"]], state.fSection === "counter" ? "all" : state.fSection, v=> setState({fSection:v})));
  box.appendChild(filters);

  const copyBtn = el("button", {class:"primary", text:"Salin daftar belum hadir (" + rows.length + ")"});
  copyBtn.addEventListener("click", async ()=>{
    if(!rows.length){ setState({adminMsg:"Semua peserta sudah hadir."}); return; }
    const lines = ["Daftar belum mengerjakan training - " + gelLabel(), ""];
    rows.forEach((p,i)=> lines.push((i+1) + ". " + p.nama + " (" + p.nik + ") - " + SECTION_INFO[p.section].label));
    await copyText(lines.join("\n"));
    setState({adminMsg:"Daftar belum hadir tersalin, tinggal paste ke WhatsApp."});
  });
  box.appendChild(copyBtn);
  if(state.adminMsg) box.appendChild(el("div", {class:"success-text", style:"margin-top:10px;", text:state.adminMsg}));

  const list = el("div", {class:"result-list"});
  if(rows.length === 0) list.appendChild(el("div", {class:"loading", text:"Semua peserta sudah hadir."}));
  rows.forEach(p=>{
    const info = SECTION_INFO[p.section];
    const item = el("div", {class:"result-item", style:"--c:" + info.color});
    const left = el("div", {class:"result-left"});
    left.appendChild(el("div", {class:"result-name", text:p.nama}));
    left.appendChild(el("div", {class:"result-meta", text:p.nik + " \u00b7 " + info.label}));
    item.appendChild(left);
    list.appendChild(item);
  });
  box.appendChild(list);
  return box;
}

function renderAdminHadir(){
  const box = el("div");
  const people = {};
  state.adminData.hasil.forEach(h=>{
    const k = h.section + "|" + h.identifier;
    const p = people[k] || (people[k] = {section:h.section, id:h.identifier, nama:h.nama, dates:{}, pre:null, post:null});
    p.dates[tglKey(h.selesai_at)] = true;
  });
  hasilFiltered().forEach(h=>{
    const p = people[h.section + "|" + h.identifier];
    p.inFilter = true;
    const f = h.jenis === "pretest" ? "pre" : "post";
    if(!p[f] || new Date(h.selesai_at) > new Date(p[f].selesai_at)) p[f] = h;
  });
  let rows = Object.values(people).filter(p=> p.inFilter);
  if(state.fSection !== "all") rows = rows.filter(p=> p.section === state.fSection);
  rows.sort((a,b)=> String(a.nama).localeCompare(String(b.nama)));
  const terdaftar = state.adminData.peserta.filter(p=> state.fSection === "all" || p.section === state.fSection).length;

  const stats = el("div", {class:"stat-grid two"});
  [["Sudah hadir", rows.length, "var(--good)"],["Terdaftar", terdaftar, "var(--ink)"]].forEach(x=>{
    const c = el("div", {class:"stat"});
    c.appendChild(el("div", {class:"stat-num", text:String(x[1]), style:"color:" + x[2]}));
    c.appendChild(el("div", {class:"stat-label", text:x[0]}));
    stats.appendChild(c);
  });
  box.appendChild(stats);

  box.appendChild(el("p", {class:"sub", style:"margin-bottom:6px;", text:"Pilih satu atau beberapa tanggal. Peserta dihitung hadir kalau ikut di salah satu tanggal yang dipilih."}));
  const filters = el("div", {class:"filters one"});
  filters.appendChild(gelSelect());
  filters.appendChild(selectEl([["all","Semua section"],["counter","Counter"],["scanner","Scanner"],["auditor","Auditor"]], state.fSection, v=> setState({fSection:v})));
  box.appendChild(filters);

  const copyBtn = el("button", {class:"primary", text:"Salin daftar sudah hadir (" + rows.length + ")"});
  copyBtn.addEventListener("click", async ()=>{
    if(!rows.length){ setState({adminMsg:"Belum ada yang hadir."}); return; }
    const lines = ["Daftar sudah hadir training - " + gelLabel(), ""];
    rows.forEach((p,i)=> lines.push((i+1) + ". " + p.nama + " (" + p.id + ") - " + SECTION_INFO[p.section].label + " - " + Object.keys(p.dates).sort().map(tglShort).join(", ")));
    await copyText(lines.join("\n"));
    setState({adminMsg:"Daftar sudah hadir tersalin, tinggal paste ke WhatsApp."});
  });
  box.appendChild(copyBtn);
  if(state.adminMsg) box.appendChild(el("div", {class:"success-text", style:"margin-top:10px;", text:state.adminMsg}));

  const list = el("div", {class:"result-list"});
  if(!rows.length) list.appendChild(el("div", {class:"loading", text:"Belum ada yang hadir di tanggal ini."}));
  rows.forEach(p=>{
    const info = SECTION_INFO[p.section];
    const item = el("div", {class:"result-item", style:"--c:" + info.color});
    const left = el("div", {class:"result-left"});
    left.appendChild(el("div", {class:"result-name", text:p.nama}));
    left.appendChild(el("div", {class:"result-meta", text:p.id + " \u00b7 " + info.label + " \u00b7 hadir " + Object.keys(p.dates).sort().map(tglShort).join(", ") + " \u00b7 Pre " + (p.pre ? p.pre.nilai : "-") + " \u00b7 Post " + (p.post ? p.post.nilai : "-")}));
    item.appendChild(left);
    list.appendChild(item);
  });
  box.appendChild(list);
  return box;
}

function renderAdminKunci(){
  const box = el("div");
  box.appendChild(el("p", {class:"sub", text:"Isi NIK (atau nama untuk Counter), pilih jenis test, lalu buka kunci supaya peserta bisa mengulang."}));

  const secField = el("div", {class:"admin-field"});
  secField.appendChild(el("label", {text:"Section"}));
  secField.appendChild(selectEl([["counter","Counter"],["scanner","Scanner"],["auditor","Auditor"]], state.adminSection, v=>{ state.adminSection = v; }));
  box.appendChild(secField);

  const idField = el("div", {class:"admin-field"});
  idField.appendChild(el("label", {text:"NIK / Nama peserta"}));
  const idInput = el("input", {type:"text", placeholder:"Contoh: 2308171", value: state.adminIdentifier});
  idInput.addEventListener("input", e=>{ state.adminIdentifier = e.target.value; });
  idField.appendChild(idInput);
  box.appendChild(idField);

  const jenisField = el("div", {class:"admin-field"});
  jenisField.appendChild(el("label", {text:"Jenis test"}));
  jenisField.appendChild(selectEl([["pretest","Pre Test"],["posttest","Post Test"]], state.adminJenis, v=>{ state.adminJenis = v; }));
  box.appendChild(jenisField);

  if(state.adminMsg) box.appendChild(el("div", {class: state.adminMsg.startsWith("Berhasil") ? "success-text" : "error", text: state.adminMsg}));

  const btn = el("button", {class:"primary", text: state.adminLoading ? "Memproses..." : "Buka Kunci Ulang", disabled: state.adminLoading});
  btn.addEventListener("click", async ()=>{
    const idVal = idInput.value.trim();
    if(!idVal){ setState({adminMsg:"Isi NIK/nama peserta dulu."}); return; }
    setState({adminLoading:true, adminMsg:""});
    try{
      await sbUpsert("training_test_lock", {
        section: state.adminSection, identifier: idVal, jenis: state.adminJenis,
        selesai: true, boleh_ulang: true
      }, "section,identifier,jenis");
      setState({adminLoading:false, adminMsg:"Berhasil dibuka. Peserta sekarang bisa mengulang " + JENIS_INFO[state.adminJenis].label + "."});
    }catch(err){
      setState({adminLoading:false, adminMsg:"Gagal membuka kunci. Coba lagi."});
    }
  });
  box.appendChild(btn);
  return box;
}

async function fetchLayoutUrl(){
  try{
    const r = await sb("training_setting?key=eq.layout_url&select=value");
    state.layoutUrl = (r[0] && r[0].value) ? String(r[0].value).trim() : "";
  }catch(e){ state.layoutUrl = ""; }
  if(state.screen === "menu") render();
}

function renderMenu(){
  const info = SECTION_INFO[state.section];
  const wrap = el("div");
  const nav = el("div", {class:"top-nav"});
  nav.appendChild(el("button", {class:"back", text:"←", onClick:()=> setState({screen:"home", section:null, nama:"", nik:"", identifier:"", brand:"", departemen:"", inputVal:"", inputNik:"", inputBrand:"", inputDept:"", soData:null, soMsg:""})}));
  wrap.appendChild(nav);
  wrap.appendChild(tagEl(info.label + " · " + state.nama, info));
  wrap.appendChild(el("h2", {text:"Pilih menu"}));

  const addCard = (title, desc, btn)=>{
    const card = el("div", {class:"menu-card", style:"--c:" + info.color});
    const left = el("div", {class:"menu-left"});
    left.appendChild(el("div", {class:"menu-title", text:title}));
    left.appendChild(el("div", {class:"menu-desc", text:desc}));
    card.appendChild(left);
    card.appendChild(btn);
    wrap.appendChild(card);
  };

  const b1 = el("button", {class:"menu-btn", text:"Buka"});
  b1.addEventListener("click", ()=> loadDashboard());
  addCard("Training", "Materi, Pre Test, dan Post Test", b1);

  const bl = el("button", {class:"menu-btn", text:"Buka"});
  bl.addEventListener("click", ()=> loadLayout());
  addCard("Layout", "Link layout dan upload foto bukti cek gondola", bl);

  const b3 = el("button", {class:"menu-btn", text:"Buka"});
  b3.addEventListener("click", ()=> loadSO());
  addCard("Registrasi SO", "Gondola tugas dan registrasi sarana bantu", b3);
  return wrap;
}

const BUKTI_BUCKET = "so-bukti";
function buktiUrl(path){ return SUPABASE_URL + "/storage/v1/object/public/" + BUKTI_BUCKET + "/" + path; }

function compressImage(file){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = ()=>{
      const max = 1280, sc = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement("canvas");
      cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      cv.toBlob(b=> b ? resolve(b) : reject(new Error("gagal")), "image/jpeg", 0.75);
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error("gambar tidak terbaca")); };
    img.src = url;
  });
}

async function loadLayout(){
  setState({screen:"layout", layLoading:true, layMsg:"", layData:null});
  try{
    const role = state.section, nik = encodeURIComponent(state.nik);
    const col = role === "scanner" ? "scanner_nik" : role === "auditor" ? "auditor_nik" : "counter_nik";
    const kegiatan = await sb("so_kegiatan?select=*&order=tanggal.asc");
    const items = [];
    for(const k of kegiatan){
      let pen = await sb("so_penugasan?kegiatan_id=eq." + k.id + "&" + col + "=eq." + nik + "&select=gondola,sesi,scanner_nama,scanner_lokasi,auditor_nama,auditor_lokasi,counter_nama,counter_brand&order=gondola.asc");
      let sub = null;
      if(pen.length === 0 && role !== "counter"){
        const rg = await sb("so_registrasi?kegiatan_id=eq." + k.id + "&nik=eq." + nik + "&role=eq." + role + "&pengganti_nik=not.is.null&select=pengganti_nik,pengganti_nama&limit=1");
        if(rg[0]){
          sub = {nik: rg[0].pengganti_nik, nama: rg[0].pengganti_nama};
          pen = await sb("so_penugasan?kegiatan_id=eq." + k.id + "&" + col + "=eq." + encodeURIComponent(sub.nik) + "&select=gondola,sesi,scanner_nama,scanner_lokasi,auditor_nama,auditor_lokasi,counter_nama,counter_brand&order=gondola.asc");
        }
      }
      const bukti = pen.length ? await sb("so_bukti?kegiatan_id=eq." + k.id + "&nik=eq." + nik + "&role=eq." + role + "&select=id,path,uploaded_at&order=uploaded_at.asc") : [];
      items.push({k, pen, bukti, sub});
    }
    setState({layLoading:false, layData:items});
  }catch(e){
    setState({layLoading:false, layData:[], layMsg:"Gagal memuat data. Coba lagi."});
  }
}

async function uploadBukti(k, files){
  const role = state.section;
  if(!files.length) return;
  setState({layBusy:true, layMsg:""});
  let ok = 0;
  try{
    for(let i=0;i<files.length;i++){
      const blob = await compressImage(files[i]);
      const path = k.id + "/" + role + "_" + state.nik + "_" + Date.now() + "_" + i + ".jpg";
      const res = await fetch(SUPABASE_URL + "/storage/v1/object/" + BUKTI_BUCKET + "/" + path, {
        method:"POST",
        headers:{ "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY, "Content-Type":"image/jpeg", "x-upsert":"false" },
        body: blob
      });
      if(!res.ok) throw new Error("upload");
      await sbInsert("so_bukti", { kegiatan_id:k.id, nik:state.nik, role, nama:state.nama, path, uploaded_at:new Date().toISOString() });
      ok++;
    }
    state.layBusy = false;
    await loadLayout();
    setState({layMsg: ok + " foto bukti tersimpan."});
  }catch(e){
    state.layBusy = false;
    await loadLayout();
    setState({layMsg: "Gagal upload foto" + (ok ? " (" + ok + " foto berhasil tersimpan)" : "") + ". Coba lagi."});
  }
}

async function hapusBukti(b){
  if(!confirm("Hapus foto ini?")) return;
  try{
    await fetch(SUPABASE_URL + "/rest/v1/so_bukti?id=eq." + b.id, { method:"DELETE", headers:{ "apikey":SUPABASE_KEY, "Authorization":"Bearer " + SUPABASE_KEY } });
    await fetch(SUPABASE_URL + "/storage/v1/object/" + BUKTI_BUCKET + "/" + b.path, { method:"DELETE", headers:{ "apikey":SUPABASE_KEY, "Authorization":"Bearer " + SUPABASE_KEY } });
    await loadLayout();
    setState({layMsg:"Foto dihapus."});
  }catch(e){ setState({layMsg:"Gagal menghapus foto."}); }
}

// ===== PENCOCOKAN NAMA (fuzzy) =====
function normNama(x){ return String(x || "").toLowerCase().replace(/[^a-z\s]/g, " ").replace(/\s+/g, " ").trim(); }
function lev(a, b){
  const m = a.length, n = b.length;
  if(!m) return n; if(!n) return m;
  let prev = Array.from({length:n+1}, (_,i)=> i);
  for(let i=1;i<=m;i++){
    const cur = [i];
    for(let j=1;j<=n;j++) cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
function simStr(a, b){ const mx = Math.max(a.length, b.length); return mx ? 1 - lev(a, b) / mx : 0; }
function skorNama(query, nama){
  const q = normNama(query), n = normNama(nama);
  if(!q || !n) return 0;
  const whole = simStr(q, n);
  const qt = q.split(" "), nt = n.split(" ");
  let sum = 0;
  qt.forEach(t=>{
    let best = 0;
    nt.forEach(w=>{
      let sc = simStr(t, w);
      if(t.length >= 3 && (w.startsWith(t) || t.startsWith(w))) sc = Math.max(sc, 0.92);
      if(sc > best) best = sc;
    });
    sum += best;
  });
  const tok = sum / qt.length;
  return Math.max(whole, tok * (qt.length >= nt.length ? 1 : 0.95));
}

// ===== REGISTRASI SO (PESERTA) =====
async function loadSO(){
  setState({screen:"so", soLoading:true, soMsg:"", soData:null});
  try{
    const role = state.section, nik = encodeURIComponent(state.nik);
    const col = role === "scanner" ? "scanner_nik" : role === "auditor" ? "auditor_nik" : "counter_nik";
    const kegiatan = await sb("so_kegiatan?registrasi_buka=eq.true&select=*&order=tanggal.asc");
    const items = [];
    for(const k of kegiatan){
      const penAll = await sb("so_penugasan?kegiatan_id=eq." + k.id + "&" + col + "=eq." + nik + "&select=gondola,sesi,scanner_nama,scanner_lokasi,auditor_nama,auditor_lokasi,counter_nama,counter_brand&order=gondola.asc");
      const pen = k.sesi_aktif ? penAll.filter(r=> r.sesi === k.sesi_aktif) : penAll;
      const reg = await sb("so_registrasi?kegiatan_id=eq." + k.id + "&nik=eq." + nik + "&role=eq." + role + "&select=*");
      let roster = null, sub = null;
      const subReg = reg.find(r=> r.pengganti_nik);
      if(role !== "counter" && (pen.length === 0 || subReg)){
        const nikCol = role === "scanner" ? "scanner_nik" : "auditor_nik";
        roster = await sbAll("so_penugasan?kegiatan_id=eq." + k.id + (k.sesi_aktif ? "&sesi=eq." + k.sesi_aktif : "") + "&" + nikCol + "=not.is.null&select=gondola,sesi,scanner_nik,scanner_nama,scanner_lokasi,auditor_nik,auditor_nama,auditor_lokasi,counter_nama,counter_brand&order=gondola.asc");
        if(subReg) sub = {nik: subReg.pengganti_nik, nama: subReg.pengganti_nama};
        else {
          const taken = await sb("so_registrasi?kegiatan_id=eq." + k.id + "&role=eq." + role + (k.sesi_aktif ? "&sesi=eq." + k.sesi_aktif : "") + "&select=nik,pengganti_nik");
          roster.taken = {};
          taken.forEach(t=>{ roster.taken[t.nik] = true; if(t.pengganti_nik) roster.taken[t.pengganti_nik] = true; });
        }
      }
      items.push({k, pen, penAll, reg, roster, sub});
    }
    setState({soLoading:false, soData:items});
  }catch(e){
    setState({soLoading:false, soData:[], soMsg:"Gagal memuat data registrasi. Coba lagi."});
  }
}

function groupGondola(rows, role){
  const out = []; let cur = null;
  rows.forEach(r=>{
    const lok = role === "auditor" ? r.auditor_lokasi : r.scanner_lokasi;
    const key = [r.scanner_nama, r.auditor_nama, r.counter_nama, lok, r.sesi].join("|");
    if(cur && cur.key === key && r.gondola === cur.to + 1){ cur.to = r.gondola; }
    else { cur = {key, from:r.gondola, to:r.gondola, lok, sesi:r.sesi, scanner:r.scanner_nama, auditor:r.auditor_nama, counter:r.counter_nama}; out.push(cur); }
  });
  return out;
}

function fmtTgl(iso){
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString("id-ID", {weekday:"long", day:"numeric", month:"long", year:"numeric"});
}

async function submitSO(k, vals, sub){
  const role = state.section;
  const body = { kegiatan_id:k.id, nik:state.nik, role, sesi:k.sesi_aktif, nama:state.nama,
    departemen: role === "counter" ? state.departemen : null,
    hht_no: vals.hht || null, papan_jalan_no: vals.papan || null, id_participant: vals.idp || null,
    registered_at: new Date().toISOString() };
  if(sub){ body.pengganti_nik = sub.nik; body.pengganti_nama = sub.nama; }
  try{
    if(sub){
      const dup = await sb("so_registrasi?kegiatan_id=eq." + k.id + "&role=eq." + role + "&pengganti_nik=eq." + encodeURIComponent(sub.nik) + "&nik=neq." + encodeURIComponent(state.nik) + "&select=nama");
      if(dup.length){ setState({soMsg:"Gagal: " + sub.nama + " sudah digantikan oleh " + dup[0].nama + "."}); return; }
    }
    await sbUpsert("so_registrasi", body, "kegiatan_id,nik,role,sesi");
    await loadSO();
    setState({soMsg:"Registrasi tersimpan."});
  }catch(e){
    setState({soMsg:"Gagal menyimpan registrasi. Coba lagi."});
  }
}

function renderSO(){
  const info = SECTION_INFO[state.section];
  const role = state.section;
  const wrap = el("div");
  const nav = el("div", {class:"top-nav"});
  nav.appendChild(el("button", {class:"back", text:"←", onClick:()=> setState({screen:"menu", soMsg:""})}));
  wrap.appendChild(nav);
  wrap.appendChild(tagEl(info.label + " · " + state.nama, info));
  wrap.appendChild(el("h2", {text:"Registrasi SO"}));
  if(state.soLoading || !state.soData){
    wrap.appendChild(el("div", {class:"loading", text:"Memuat..."}));
    return wrap;
  }
  if(state.soMsg) wrap.appendChild(el("div", {class: state.soMsg.indexOf("Gagal") === 0 ? "error" : "success-text", style:"margin-bottom:10px;", text:state.soMsg}));
  if(state.soData.length === 0){
    wrap.appendChild(el("p", {class:"sub", text:"Registrasi SO belum dibuka oleh admin. Coba lagi nanti."}));
    return wrap;
  }
  state.soData.forEach(({k, pen, penAll, reg, roster, sub: subSaved})=>{
    const card = el("div", {class:"so-card"});
    card.appendChild(el("h3", {text:k.nama}));
    const meta = el("div", {style:"margin-bottom:8px;"});
    meta.appendChild(el("span", {class:"chip muted", text:fmtTgl(k.tanggal)}));
    meta.appendChild(el("span", {class:"chip", text: k.sesi_aktif ? "Sesi " + SESI_LABEL[k.sesi_aktif] : "Sesi belum ditentukan"}));
    card.appendChild(meta);

    const pickSt = (state.soSub && state.soSub[k.id]) || {};
    let sub = subSaved || null, penEff = pen;
    if(!sub && pen.length === 0 && roster && pickSt.nik){
      const nm = roster.find(r=> (role === "scanner" ? r.scanner_nik : r.auditor_nik) === pickSt.nik);
      if(nm) sub = {nik: pickSt.nik, nama: role === "scanner" ? nm.scanner_nama : nm.auditor_nama};
    }
    if(sub && roster) penEff = roster.filter(r=> (role === "scanner" ? r.scanner_nik : r.auditor_nik) === sub.nik);
    const ranges = groupGondola(penEff, role);
    if(ranges.length){
      card.appendChild(el("div", {class:"sub", style:"margin:4px 0;", text: sub ? "Gondola tugas (menggantikan " + sub.nama + ")" : "Gondola tugas kamu"}));
      ranges.forEach(g=>{
        const box = el("div", {class:"gond"});
        const b = el("b", {text: g.from === g.to ? String(g.from) : g.from + " – " + g.to});
        box.appendChild(b);
        if(g.lok) box.appendChild(el("span", {class:"chip muted", style:"margin-left:8px;", text:g.lok}));
        if(g.sesi) box.appendChild(el("span", {class:"chip", style:"margin-left:6px;", text:SESI_LABEL[g.sesi]}));
        const team = [];
        if(g.counter) team.push("Counter: " + g.counter);
        if(g.scanner) team.push("Scanner: " + g.scanner);
        if(g.auditor) team.push("Auditor: " + g.auditor);
        if(team.length) box.appendChild(el("div", {class:"menu-desc", text:team.join(" · ")}));
        card.appendChild(box);
      });
    } else if(role === "counter"){
      card.appendChild(el("p", {class:"sub", text:"Penugasan gondola untuk Counter belum tersedia."}));
    } else {
      const other = (penAll || []).length;
      card.appendChild(el("p", {class:"sub", text: other ? "Kamu tidak bertugas di sesi " + SESI_LABEL[k.sesi_aktif] + ". Gondola tugas kamu ada di sesi lain, jadi tidak perlu registrasi sekarang." : "Tidak ada penugasan gondola atas NIK kamu di kegiatan ini. Jika kamu menggantikan peserta yang terdaftar, pilih nama yang kamu gantikan di bawah ini."}));
    }
    if(!subSaved && pen.length === 0 && (penAll || []).length === 0 && role !== "counter" && roster){
      const people = {};
      roster.forEach(r=>{
        const n = role === "scanner" ? r.scanner_nik : r.auditor_nik;
        if(!n || roster.taken[n]) return;
        const p = people[n] || (people[n] = {nik:n, nama: role === "scanner" ? r.scanner_nama : r.auditor_nama, lok: role === "scanner" ? r.scanner_lokasi : r.auditor_lokasi, from:r.gondola, to:r.gondola});
        p.to = r.gondola; p.n = (p.n || 0) + 1;
      });
      const list = Object.values(people).sort((a,b)=> String(a.nama).localeCompare(String(b.nama)));
      const setPick = o=>{ state.soSub = Object.assign({}, state.soSub, {[k.id]: Object.assign({}, pickSt, o)}); render(); };
      const fmtP = p=> p.nama + " (" + p.nik + ") \u00b7 " + (p.lok || "-") + " \u00b7 gondola " + p.from + "\u2013" + p.to + (p.n > 1 ? " (" + p.n + ")" : "");
      card.appendChild(el("div", {class:"sub", style:"margin:10px 0 4px;", text:"Menggantikan siapa? Ketik namanya, boleh mirip-mirip."}));
      const qi = el("input", {type:"text", placeholder:"Nama orang yang kamu gantikan", value: pickSt.q || ""});
      const cari = ()=> setPick({q:qi.value.trim(), nik:""});
      qi.addEventListener("keydown", e=>{ if(e.key === "Enter") cari(); });
      card.appendChild(qi);
      const cb = el("button", {class:"ghost", style:"margin-bottom:8px;", text:"Cocokkan nama"});
      cb.addEventListener("click", cari);
      card.appendChild(cb);
      if(pickSt.q){
        const scored = list.map(p=> ({p, sc: skorNama(pickSt.q, p.nama)})).filter(x=> x.sc >= 0.5).sort((a,b)=> b.sc - a.sc).slice(0, 5);
        if(!scored.length){
          card.appendChild(el("p", {class:"sub", text:"Nama tidak ketemu di daftar penugasan. Coba ejaan lain, atau lihat semua nama di bawah."}));
        } else {
          card.appendChild(el("div", {class:"sub", style:"margin:4px 0;", text:"Yang paling mirip. Tekan nama yang benar:"}));
          scored.forEach(x=>{
            const on = pickSt.nik === x.p.nik;
            const opt = el("button", {class: on ? "primary" : "ghost", style:"text-align:left;margin-bottom:6px;", text:(on ? "\u2713 " : "") + fmtP(x.p)});
            opt.addEventListener("click", ()=> setPick({nik:x.p.nik}));
            card.appendChild(opt);
          });
        }
      }
      const allBtn = el("button", {class:"ghost", style:"margin-bottom:8px;", text: pickSt.all ? "Sembunyikan semua nama" : "Lihat semua nama"});
      allBtn.addEventListener("click", ()=> setPick({all: !pickSt.all}));
      card.appendChild(allBtn);
      if(pickSt.all) card.appendChild(selectEl([["","Pilih peserta yang digantikan"]].concat(list.map(p=> [p.nik, fmtP(p)])), pickSt.nik || "", v=> setPick({nik:v})));
    }

    const canReg = !!k.sesi_aktif && (role === "counter" || ranges.length > 0);
    if(sub && ranges.length === 0) sub = null;
    const mine = reg.find(r=> r.sesi === k.sesi_aktif);
    if(!k.sesi_aktif){
      card.appendChild(el("p", {class:"sub", text:"Admin belum menentukan sesi (Backroom atau Selling). Registrasi dibuka setelah sesi ditentukan."}));
    } else if(canReg){
      if(mine && mine.dikembalikan){
        card.appendChild(el("span", {class:"chip good", text:"Sarana sudah dikembalikan"}));
      } else {
        if(mine) card.appendChild(el("div", {style:"margin:8px 0;"}, [el("span", {class:"chip good", text:"Sudah registrasi · sesi " + SESI_LABEL[k.sesi_aktif]})]));
        let hht=null, papan=null, idp=null;
        if(role === "scanner"){
          card.appendChild(el("label", {class:"req-label"}, [document.createTextNode("Nomor HHT "), el("span", {class:"star", text:"* wajib diisi"})]));
          hht = el("input", {type:"text", class:"req", placeholder:"Nomor HHT", value: mine ? (mine.hht_no || "") : ""});
          card.appendChild(hht);
        }
        if(role === "auditor"){
          card.appendChild(el("label", {class:"req-label"}, [document.createTextNode("Nomor papan jalan "), el("span", {class:"star", text:"* wajib diisi"})]));
          papan = el("input", {type:"text", class:"req", placeholder:"Nomor papan jalan", value: mine ? (mine.papan_jalan_no || "") : ""});
          card.appendChild(papan);
        }
        if(role !== "counter"){
          card.appendChild(el("label", {class:"req-label"}, [document.createTextNode("ID participant "), el("span", {class:"star", text:"* wajib diisi"})]));
          idp = el("input", {type:"text", class:"req", placeholder:"ID participant", value: mine ? (mine.id_participant || "") : ""});
          card.appendChild(idp);
        }
        const btn = el("button", {class:"primary", text: role === "counter" ? (mine ? "Sudah Done" : "Done") : (mine ? "Perbarui registrasi" : "Registrasi")});
        btn.addEventListener("click", ()=>{
          const vals = { hht: hht ? hht.value.trim() : "", papan: papan ? papan.value.trim() : "", idp: idp ? idp.value.trim() : "" };
          if(role === "scanner" && !vals.hht){ setState({soMsg:"Gagal: nomor HHT belum diisi."}); return; }
          if(role === "auditor" && !vals.papan){ setState({soMsg:"Gagal: nomor papan jalan belum diisi."}); return; }
          if(role !== "counter" && !vals.idp){ setState({soMsg:"Gagal: ID participant belum diisi."}); return; }
          submitSO(k, vals, sub);
        });
        card.appendChild(btn);
      }
      if(mine && !mine.dikembalikan && role !== "counter"){
        card.appendChild(el("p", {class:"sub", style:"margin-top:8px;", text:"Sarana bantu wajib dikembalikan ke MMD setelah SO selesai."}));
      }
    }
    wrap.appendChild(card);
  });
  return wrap;
}

  }
  const {kegiatan, pen, reg, bukti} = state.adminSO;
  if(state.adminMsg) box.appendChild(el("div", {class: state.adminMsg.indexOf("Gagal") === 0 ? "error" : "success-text", style:"margin-bottom:10px;", text:state.adminMsg}));

  // link layout
  const lay = el("div", {class:"so-card"});
  lay.appendChild(el("h3", {text:"Link layout"}));
  const li = el("input", {type:"text", placeholder:"https://...", value: state.layoutDraft});
  li.addEventListener("input", e=>{ state.layoutDraft = e.target.value; });
  lay.appendChild(li);
  const lb = el("button", {class:"primary", text:"Simpan link layout"});
  lb.addEventListener("click", ()=> patchSO("training_setting?key=eq.layout_url", { value: li.value.trim(), updated_at: new Date().toISOString() }, "Link layout tersimpan."));
  lay.appendChild(lb);
  box.appendChild(lay);

  // kontrol kegiatan
  kegiatan.forEach(k=>{
    const c = el("div", {class:"so-card"});
    c.appendChild(el("h3", {text:k.nama}));
    const row = el("div", {style:"margin-bottom:8px;"});
    row.appendChild(el("span", {class:"chip " + (k.registrasi_buka ? "good" : "muted"), text: k.registrasi_buka ? "Registrasi DIBUKA" : "Registrasi ditutup"}));
    row.appendChild(el("span", {class:"chip", text: k.sesi_aktif ? "Sesi " + SESI_LABEL[k.sesi_aktif] : "Sesi belum ditentukan"}));
    c.appendChild(row);
    c.appendChild(selectEl([["","Sesi belum ditentukan"],["backroom","Sesi Backroom"],["selling","Sesi Selling"]], k.sesi_aktif || "", v=> patchSO("so_kegiatan?id=eq." + k.id, { sesi_aktif: v || null }, "Sesi " + k.nama + " diubah.")));
    const tb = el("button", {class: k.registrasi_buka ? "ghost" : "primary", style:"margin-top:8px;", text: k.registrasi_buka ? "Tutup registrasi" : "Buka registrasi"});
    tb.addEventListener("click", ()=> patchSO("so_kegiatan?id=eq." + k.id, { registrasi_buka: !k.registrasi_buka }, k.registrasi_buka ? "Registrasi ditutup." : "Registrasi dibuka."));
    c.appendChild(tb);
    box.appendChild(c);
  });

  // daftar registrasi
  const cur = kegiatan.find(k=> k.id === state.soKid) || kegiatan[0];
  if(!cur) return box;
  const sesi = state.soSesi || cur.sesi_aktif || "backroom";
  const filters = el("div", {class:"filters"});
  filters.appendChild(selectEl(kegiatan.map(k=> [String(k.id), k.nama]), String(cur.id), v=> setState({soKid:Number(v), adminMsg:""})));
  filters.appendChild(selectEl([["backroom","Backroom"],["selling","Selling"]], sesi, v=> setState({soSesi:v, adminMsg:""})));
  box.appendChild(filters);

  const expected = {};
  pen.filter(p=> p.kegiatan_id === cur.id && (!p.sesi || p.sesi === sesi)).forEach(p=>{
    if(p.scanner_nik) expected["scanner|" + p.scanner_nik] = {role:"scanner", nik:p.scanner_nik, nama:p.scanner_nama};
    if(p.auditor_nik) expected["auditor|" + p.auditor_nik] = {role:"auditor", nik:p.auditor_nik, nama:p.auditor_nama};
  });
  const regHere = reg.filter(r=> r.kegiatan_id === cur.id && r.sesi === sesi);
  const regMap = {}; regHere.forEach(r=>{ regMap[r.role + "|" + r.nik] = r; if(r.pengganti_nik) regMap[r.role + "|" + r.pengganti_nik] = r; });
  const belumReg = Object.keys(expected).filter(k=> !regMap[k]).map(k=> expected[k]);
  const belumKembali = regHere.filter(r=> r.role !== "counter" && !r.dikembalikan);

  const stats = el("div", {class:"stat-grid"});
  [["Terdaftar", regHere.length, "var(--good)"],["Belum registrasi", belumReg.length, "var(--bad)"],["Belum kembali", belumKembali.length, "var(--accent)"]].forEach(s=>{
    const st = el("div", {class:"stat"});
    st.appendChild(el("div", {class:"stat-num", text:String(s[1]), style:"color:" + s[2]}));
    st.appendChild(el("div", {class:"stat-label", text:s[0]}));
    stats.appendChild(st);
  });
  box.appendChild(stats);

  const head = cur.nama + " · sesi " + SESI_LABEL[sesi];
  const b1 = el("button", {class:"primary", text:"Salin daftar belum registrasi (" + belumReg.length + ")"});
  b1.addEventListener("click", async ()=>{
    if(!belumReg.length){ setState({adminMsg:"Semua sudah registrasi."}); return; }
    const lines = ["Belum registrasi SO - " + head, ""];
    belumReg.forEach((p,i)=> lines.push((i+1) + ". " + p.nama + " (" + p.nik + ") - " + SECTION_INFO[p.role].label));
    await copyText(lines.join("\n"));
    setState({adminMsg:"Daftar belum registrasi tersalin, tinggal paste ke WhatsApp."});
  });
  box.appendChild(b1);
  const b2 = el("button", {class:"ghost", style:"margin-top:8px;", text:"Salin daftar belum mengembalikan (" + belumKembali.length + ")"});
  b2.addEventListener("click", async ()=>{
    if(!belumKembali.length){ setState({adminMsg:"Semua sarana bantu sudah dikembalikan."}); return; }
    const lines = ["Belum mengembalikan sarana bantu - " + head, ""];
    belumKembali.forEach((r,i)=> lines.push((i+1) + ". " + (r.nama || r.nik) + " (" + r.nik + ") - " + SECTION_INFO[r.role].label + (r.role === "scanner" ? " · HHT " + (r.hht_no || "-") : " · Papan " + (r.papan_jalan_no || "-")) + " · ID " + (r.id_participant || "-")));
    await copyText(lines.join("\n"));
    setState({adminMsg:"Daftar belum mengembalikan tersalin, tinggal paste ke WhatsApp."});
  });
  box.appendChild(b2);

  // bukti cek gondola
  const buktiHere = (bukti || []).filter(b=> b.kegiatan_id === cur.id);
  const buktiMap = {}; buktiHere.forEach(b=>{ (buktiMap[b.role + "|" + b.nik] = buktiMap[b.role + "|" + b.nik] || []).push(b); });
  const expectedAll = {};
  pen.filter(p=> p.kegiatan_id === cur.id).forEach(p=>{
    if(p.scanner_nik) expectedAll["scanner|" + p.scanner_nik] = {role:"scanner", nik:p.scanner_nik, nama:p.scanner_nama};
    if(p.auditor_nik) expectedAll["auditor|" + p.auditor_nik] = {role:"auditor", nik:p.auditor_nik, nama:p.auditor_nama};
  });
  const belumBukti = Object.keys(expectedAll).filter(k=> !buktiMap[k]).map(k=> expectedAll[k]);
  const bh = el("h3", {text:"Bukti cek gondola (" + (Object.keys(expectedAll).length - belumBukti.length) + " / " + Object.keys(expectedAll).length + " sudah upload)", style:"margin:18px 0 8px;"});
  box.appendChild(bh);
  const bb = el("button", {class:"ghost", text:"Salin daftar belum upload bukti (" + belumBukti.length + ")"});
  bb.addEventListener("click", async ()=>{
    if(!belumBukti.length){ setState({adminMsg:"Semua sudah upload bukti."}); return; }
    const lines = ["Belum upload bukti cek gondola - " + cur.nama, ""];
    belumBukti.forEach((p,i)=> lines.push((i+1) + ". " + p.nama + " (" + p.nik + ") - " + SECTION_INFO[p.role].label));
    await copyText(lines.join("\n"));
    setState({adminMsg:"Daftar belum upload bukti tersalin, tinggal paste ke WhatsApp."});
  });
  box.appendChild(bb);
  const bl = el("div", {class:"result-list"});
  if(!buktiHere.length) bl.appendChild(el("div", {class:"loading", text:"Belum ada foto bukti."}));
  Object.keys(buktiMap).forEach(key=>{
    const arr = buktiMap[key], f = arr[0], info = SECTION_INFO[f.role];
    const item = el("div", {class:"result-item", style:"--c:" + info.color + ";flex-direction:column;align-items:flex-start;"});
    item.appendChild(el("div", {class:"result-name", text:(f.nama || f.nik) + " \u00b7 " + arr.length + " foto"}));
    item.appendChild(el("div", {class:"result-meta", text:f.nik + " \u00b7 " + info.label}));
    const th = el("div", {class:"thumbs"});
    arr.forEach(b=>{
      const t = el("div", {class:"thumb"});
      t.appendChild(el("a", {href:buktiUrl(b.path), target:"_blank", rel:"noopener"}, [el("img", {src:buktiUrl(b.path), alt:"bukti", loading:"lazy"})]));
      th.appendChild(t);
    });
    item.appendChild(th);
    bl.appendChild(item);
  });
  box.appendChild(bl);

  const list = el("div", {class:"result-list"});
  if(!regHere.length) list.appendChild(el("div", {class:"loading", text:"Belum ada yang registrasi di sesi ini."}));
  regHere.forEach(r=>{
    const info = SECTION_INFO[r.role];
    const item = el("div", {class:"result-item", style:"--c:" + info.color});
    const left = el("div", {class:"result-left"});
    left.appendChild(el("div", {class:"result-name", text:r.nama || r.nik}));
    const det = [r.nik, info.label];
    if(r.pengganti_nama) det.push("pengganti dari " + r.pengganti_nama + " (" + r.pengganti_nik + ")");
    if(r.hht_no) det.push("HHT " + r.hht_no);
    if(r.papan_jalan_no) det.push("Papan " + r.papan_jalan_no);
    if(r.id_participant) det.push("ID " + r.id_participant);
    left.appendChild(el("div", {class:"result-meta", text:det.join(" · ")}));
    item.appendChild(left);
    if(r.role !== "counter"){
      const tg = el("button", {class:"mini-btn", text: r.dikembalikan ? "Batalkan kembali" : "Tandai kembali"});
      tg.addEventListener("click", ()=> patchSO("so_registrasi?id=eq." + r.id, { dikembalikan: !r.dikembalikan, dikembalikan_at: r.dikembalikan ? null : new Date().toISOString() }, r.dikembalikan ? "Status pengembalian dibatalkan." : "Ditandai sudah dikembalikan."));
      item.appendChild(tg);
    }
    list.appendChild(item);
  });
  box.appendChild(list);
  return box;
}

</script>
</body>
</html>
